/* ===== Phase 3O : Stabilisation / diagnostic interne ===== */
function diagnosticResult(){
  const errors=[],warnings=[],ok=[];
  const activeAcc=activeAccounts(),primaryRoles=activeAcc.filter(a=>a.role==="primary_spending");
  const pa=primaryAccount(),s=state.settings||defaultSettings;
  const today=localToday();
  const add=(bucket,label,detail="")=>bucket.push({label,detail});

  if(!activeAcc.length)add(errors,"Comptes","Aucun compte actif.");
  else add(ok,"Comptes",`${activeAcc.length} compte(s) actif(s).`);

  if(!pa)add(errors,"Compte principal","Aucun compte principal de dépenses disponible.");
  else{
    add(ok,"Compte principal",`${pa.name} · ${pa.currency}.`);
    if(primaryRoles.length!==1)add(warnings,"Rôle principal",`${primaryRoles.length} compte(s) portent le rôle principal; un seul est recommandé.`);
    if(s.primaryAccountId&&s.primaryAccountId!==pa.id)add(warnings,"Paramètre principal","L’identifiant principal enregistré ne correspond pas au compte utilisé par le moteur.");
  }

  const ref=dateFromISO(s.balanceReferenceDate);
  if(!ref)add(errors,"Solde de référence","Date de référence EOP absente.");
  else if(ref>today)add(errors,"Solde de référence","La date de référence EOP est dans le futur.");
  else add(ok,"Solde de référence",fmtDate(ref));

  const range=activeCycleRange();
  if(!(range.start instanceof Date)||!(range.end instanceof Date)||range.end<=range.start)add(errors,"Cycle actif","Période de cycle invalide.");
  else add(ok,"Cycle actif",`${fmtDate(range.start)} → ${fmtDate(range.end)}.`);

  const accountsById=new Map(state.accounts.map(a=>[a.id,a]));
  const activeRuleRows=state.rules.filter(r=>!r.archived);

  for(const r of activeRuleRows){
    if(!Number.isFinite(Number(r.amount))||Number(r.amount)<0)
      add(errors,`Règle · ${r.name||r.id}`,"Montant invalide.");

    if(["fixed_income","debit","reserved_budget"].includes(r.type)){
      if(!accountsById.has(r.accountId))add(errors,`Règle · ${r.name||r.id}`,"Compte lié introuvable.");
    }
    if(r.type==="transfer"){
      if(!accountsById.has(r.sourceAccountId)||!accountsById.has(r.destinationAccountId))
        add(errors,`Virement · ${r.name||r.id}`,"Compte source ou destination introuvable.");
      if(r.sourceAccountId===r.destinationAccountId)
        add(errors,`Virement · ${r.name||r.id}`,"Source et destination sont identiques.");
    }

    // Les budgets réservés hebdomadaires/mensuels n'ont volontairement
    // aucune date fixe : ils protègent une enveloppe et ne génèrent pas
    // un événement calendrier.
    if(r.type!=="reserved_budget"&&r.frequency==="weekly"&&(!Number.isInteger(Number(r.weekday))||Number(r.weekday)<0||Number(r.weekday)>6))
      add(errors,`Règle · ${r.name||r.id}`,"Jour hebdomadaire invalide.");
    if(r.frequency==="biweekly"&&!dateFromISO(r.referenceDate))
      add(errors,`Règle · ${r.name||r.id}`,"Date de référence bihebdomadaire absente.");
    if(r.type!=="reserved_budget"&&r.frequency==="monthly"&&(!Number.isFinite(Number(r.monthDay))||Number(r.monthDay)<1||Number(r.monthDay)>28))
      add(errors,`Règle · ${r.name||r.id}`,"Jour mensuel invalide.");
    if(r.frequency==="annual"&&!dateFromISO(r.annualDate))
      add(errors,`Règle · ${r.name||r.id}`,"Date annuelle absente.");
  }
  if(!errors.some(x=>x.label.startsWith("Règle")||x.label.startsWith("Virement")))
    add(ok,"Règles",`${activeRuleRows.length} règle(s) structurellement cohérente(s).`);

  for(const d of activeDebts()){
    if(!Number.isFinite(Number(d.referenceBalance))||Number(d.referenceBalance)<0)
      add(errors,`Dette · ${d.name||d.id}`,"Solde de référence invalide.");
    if(!dateFromISO(d.referenceDate))
      add(errors,`Dette · ${d.name||d.id}`,"Date de référence absente.");
    if(d.monthlyRuleId){
      const rr=state.rules.find(r=>r.id===d.monthlyRuleId&&!r.archived);
      if(!rr)add(errors,`Dette · ${d.name||d.id}`,"Prélèvement mensuel lié introuvable.");
      else if(rr.type!=="debit")add(warnings,`Dette · ${d.name||d.id}`,"La règle liée n’est pas un prélèvement.");
    }else add(warnings,`Dette · ${d.name||d.id}`,"Aucun prélèvement mensuel lié.");
  }
  if(activeDebts().length&&!errors.some(x=>x.label.startsWith("Dette")))
    add(ok,"Dettes",`${activeDebts().length} dette(s) cohérente(s).`);

  for(const p of visibleProjects()){
    if(!Number.isFinite(Number(p.targetAmount))||Number(p.targetAmount)<=0)
      add(errors,`Projet · ${p.name||p.id}`,"Montant cible invalide.");
    if(!dateFromISO(p.targetDate))
      add(errors,`Projet · ${p.name||p.id}`,"Date cible invalide.");
  }
  if(visibleProjects().length&&!errors.some(x=>x.label.startsWith("Projet")))
    add(ok,"Projets",`${visibleProjects().length} projet(s) cohérent(s).`);

  let orphanOps=0;
  for(const t of state.transactions){
    if(t.sourceAccountId&&!accountsById.has(t.sourceAccountId))orphanOps++;
    if(t.destinationAccountId&&!accountsById.has(t.destinationAccountId))orphanOps++;
    if(t.budgetRuleId&&!state.rules.some(r=>r.id===t.budgetRuleId))orphanOps++;
    if(t.debtId&&!state.debts.some(d=>d.id===t.debtId))orphanOps++;
  }
  if(orphanOps)add(warnings,"Historique",`${orphanOps} référence(s) ancienne(s) ne pointent plus vers un objet actuel. Les opérations restent conservées.`);
  else add(ok,"Historique",`${state.transactions.length} opération(s) sans référence orpheline.`);

  const ids=state.eventRecords.map(e=>e.id).filter(Boolean);
  const duplicateEventIds=ids.length-new Set(ids).size;
  if(duplicateEventIds)add(errors,"Événements",`${duplicateEventIds} identifiant(s) dupliqué(s).`);
  else add(ok,"Événements",`${state.eventRecords.length} événement(s) persisté(s), aucun doublon.`);

  const eop=calculateEOP(),reserve=reserveBreakdown(),safe=calculateSafe(),margin=calculateCycleMargin();
  if(!eop.available)add(errors,"EOP calculé","Calcul indisponible.");
  if(!reserve.ready)add(errors,"Réservé","Réserves non initialisées.");
  if(!safe.available)add(errors,"Safe","Calcul indisponible.");
  if(!margin.available)add(errors,"Marge","Calcul indisponible.");

  if(eop.available&&reserve.ready&&safe.available&&margin.available){
    const eps=0.011;
    const expectedFree=roundCurrency(eop.calculated-reserve.total,eop.currency);
    if(Math.abs(expectedFree-safe.currentFree)>eps)
      add(errors,"Cohérence Safe","Libre maintenant ≠ EOP calculé − Réservé.");
    else add(ok,"Cohérence Safe","Libre maintenant = EOP calculé − Réservé.");

    if(safe.safe-safe.currentFree>eps)
      add(errors,"Cohérence Safe","Safe supérieur au montant libre actuel.");
    else add(ok,"Limite Safe","Safe ne dépasse pas le libre actuel.");

    const expectedMargin=roundCurrency(margin.projectedEOP-reserve.total,margin.currency);
    if(Math.abs(expectedMargin-margin.margin)>eps)
      add(errors,"Cohérence Marge","Marge ≠ EOP prévu − Réservé.");
    else add(ok,"Cohérence Marge","Marge = EOP prévu − Réservé.");
  }

  const health=financeHealth();
  if(health.status==="blocked")add(errors,"Fiabilité",health.fatal.join(" "));
  else if(health.status==="provisional")add(warnings,"Fiabilité",health.warnings.join(" "));
  else add(ok,"Fiabilité","État courant : Fiable.");

  const status=errors.length?"error":warnings.length?"warning":"ok";
  return {status,errors,warnings,ok,counts:{
    accounts:state.accounts.length,rules:state.rules.length,transactions:state.transactions.length,
    events:state.eventRecords.length,closures:state.closures.length,projects:state.projects.length,debts:state.debts.length
  }}
}
function diagnosticStatusBadge(d){
  if(d.status==="error")return `<span class="badge bad">${d.errors.length} erreur(s)</span>`;
  if(d.status==="warning")return `<span class="badge warn">${d.warnings.length} avertissement(s)</span>`;
  return '<span class="badge good">Aucune anomalie</span>'
}
function diagnosticListHTML(items,kind){
  if(!items.length)return "";
  const title=kind==="error"?"Erreurs":kind==="warning"?"Avertissements":"Contrôles réussis";
  return `<div class="title" style="font-size:14px;margin-top:14px">${title}</div>
    <div class="list">${items.map(x=>`<div class="item"><div class="name">${safeText(x.label)}</div>${x.detail?`<div class="meta">${safeText(x.detail)}</div>`:""}</div>`).join("")}</div>`
}
function diagnosticCardHTML(){
  const d=diagnosticResult();
  return `<div class="card">
    <div class="row">
      <div><div class="title" style="margin-bottom:3px">Diagnostic de cohérence</div><div class="muted small">Contrôle technique sans modifier vos données.</div></div>
      ${diagnosticStatusBadge(d)}
    </div>
    <div class="grid2" style="margin-top:12px">
      <div class="kpi"><div class="muted small">Comptes / règles</div><div class="value">${d.counts.accounts} / ${d.counts.rules}</div></div>
      <div class="kpi"><div class="muted small">Opérations / événements</div><div class="value">${d.counts.transactions} / ${d.counts.events}</div></div>
      <div class="kpi"><div class="muted small">Projets / dettes</div><div class="value">${d.counts.projects} / ${d.counts.debts}</div></div>
      <div class="kpi"><div class="muted small">Clôtures</div><div class="value">${d.counts.closures}</div></div>
    </div>
    ${diagnosticListHTML(d.errors,"error")}
    ${diagnosticListHTML(d.warnings,"warning")}
    <details style="margin-top:14px">
      <summary style="cursor:pointer;font-weight:800;color:var(--blue2)">Voir les contrôles réussis (${d.ok.length})</summary>
      <div style="margin-top:10px">${diagnosticListHTML(d.ok,"ok")}</div>
    </details>
  </div>`
}

function renderMore(){
  const s=state.settings||defaultSettings,debt=primaryDebt();headerSub.textContent="Plus · Phase 3O";
  view.innerHTML=`<div class="card"><div class="row"><div><div class="title" style="margin-bottom:3px">Bilan analytique</div><div class="muted small">Revenus, dépenses, épargne, budgets, dette et comparaison entre cycles.</div></div><button class="btn" id="openBilan">Ouvrir</button></div></div>
  <div class="card"><div class="row"><div><div class="title" style="margin-bottom:3px">Accord D</div><div class="muted small">${debt?"Suivi de la dette actif":"Module non configuré"}</div></div><button class="btn alt" id="openDebtMore">${debt?"Ouvrir":"Configurer"}</button></div>${debt?`<div class="small muted" style="margin-top:10px">Solde réel de référence : ${money(debt.referenceBalance,debt.currency||"CAD")} · taux ${Number(debt.annualRate||0).toFixed(2)} %.</div>`:'<div class="note" style="margin-top:12px">Configurez le solde réel, le taux et liez le prélèvement mensuel existant. Aucune donnée personnelle n’est codée dans le fichier public.</div>'}</div>
  <div class="card"><div class="title">Paramètres de base</div><form id="editSettings">
    <label>Jour de clôture</label><input id="editCycleDay" type="number" min="1" max="28" value="${s.cycleDay}">
    <label>Devise principale</label><select id="editCurrency">${["CAD","TND","USD","EUR"].map(c=>`<option ${s.mainCurrency===c?"selected":""}>${c}</option>`).join("")}</select>
    <label>Réserve de sécurité</label><input id="editReserve" type="number" min="0" step="0.01" value="${s.safetyReserve}">
    <label>Cycle actif</label><input type="text" value="${fmtDate(activeCycleRange().start)} → ${fmtDate(activeCycleRange().end)}" disabled>
    <label>Date de référence du solde EOP</label><input id="editReferenceDate" type="date" value="${s.balanceReferenceDate||""}">
    <div class="muted small">À modifier seulement si vous confirmez un nouveau solde réel comme nouveau point de départ.</div>
    <div class="form-actions"><button class="btn" type="submit">Enregistrer</button></div>
  </form></div>
  ${diagnosticCardHTML()}
  <div class="card"><div class="title">Sauvegarde & restauration</div>
    <div class="note">La sauvegarde JSON contient toutes les données locales de l’application : comptes, règles, historique, clôtures, projets, Accord D et paramètres.</div>
    <div class="form-actions">
      <button class="btn" id="exportBackupBtn">Exporter une sauvegarde</button>
      <button class="btn alt" id="importBackupBtn">Importer une sauvegarde</button>
      <input id="backupFileInput" type="file" accept="application/json,.json" hidden>
    </div>
    <div class="muted small" style="margin-top:10px">Important : ce fichier contient vos données financières personnelles. Gardez-le privé et ne l’ajoutez pas au dépôt GitHub public.</div>
  </div>
  <div class="card"><div class="title">Phase 3O · Stabilisation</div><div class="note">Phase 3O n’ajoute pas de nouvelle logique financière. Elle masque les budgets analytiques entièrement nuls et ajoute un diagnostic de cohérence pour vérifier comptes, règles, historique, événements, dette, projets et identités de calcul Safe/Marge. Le schéma IndexedDB reste en DB v6.</div></div>`;

  document.getElementById("openBilan")?.addEventListener("click",()=>{page="bilan";render()});
  document.getElementById("openDebtMore")?.addEventListener("click",()=>{const d=primaryDebt();if(d)openDebtDetail(d);else openDebtSetup(null)});
  document.getElementById("exportBackupBtn")?.addEventListener("click",exportBackup);
  document.getElementById("importBackupBtn")?.addEventListener("click",()=>document.getElementById("backupFileInput")?.click());
  document.getElementById("backupFileInput")?.addEventListener("change",async e=>{
    const input=e.currentTarget,file=input.files?.[0];input.value="";
    await handleBackupFile(file)
  });
  document.getElementById("editSettings").onsubmit=async e=>{
    e.preventDefault();
    s.cycleDay=Math.max(1,Math.min(28,Number(document.getElementById("editCycleDay").value)||2));
    s.mainCurrency=document.getElementById("editCurrency").value;
    s.safetyReserve=Math.max(0,Number(document.getElementById("editReserve").value)||0);
    s.balanceReferenceDate=document.getElementById("editReferenceDate").value||null;
    s.dataVersion=6;
    await putOne(STORE_META,{key:"settings",value:s});
    state.settings=s;await syncDueEvents();await loadState();render()
  }
}

function render(){
  if(!state.onboardingComplete){renderOnboarding();return}
  nav.hidden=false;
  const navPage=page==="bilan"?"more":page;
  nav.querySelectorAll("button").forEach(b=>b.classList.toggle("active",b.dataset.page===navPage));
  if(page==="home")renderHome();
  else if(page==="manage")renderManage();
  else if(page==="history")renderHistory();
  else if(page==="projects")renderProjects();
  else if(page==="bilan")renderBilan();
  else if(page==="more")renderMore()
}
nav.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{page=b.dataset.page;manageSection=null;render()}));

async function boot(){
  try{
    db=await openDB();
    await loadState();

    if(!state.settings){
      state.settings={...defaultSettings};
      state.settings.activeCycleStart=isoLocal(cycleRange(state.settings.cycleDay||2).start);
      await putOne(STORE_META,{key:"settings",value:state.settings})
    }else{
      const migrated={...defaultSettings,...state.settings,dataVersion:6};
      if(!migrated.activeCycleStart)migrated.activeCycleStart=isoLocal(cycleRange(migrated.cycleDay||2).start);
      const changed=JSON.stringify(migrated)!==JSON.stringify(state.settings);
      state.settings=migrated;
      if(changed)await putOne(STORE_META,{key:"settings",value:state.settings})
    }

    if(state.onboardingComplete&&state.settings?.balanceReferenceDate){await syncDueEvents();await loadState();await syncProjectCycleReservations();await loadState()}
    render()
  }catch(err){
    console.error(err);
    view.innerHTML='<div class="card"><div class="title">Erreur de stockage local</div><div class="note">IndexedDB n’a pas pu être ouvert sur ce navigateur.</div></div>'
  }
}
boot();
})();
</script>
