<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nadhir Finance</title>
<style>
:root{
  --bg:#eef5ff;--card:#fff;--text:#0b1f3a;--muted:#6d7d92;
  --blue:#0867e8;--blue2:#2e8cff;--line:#dce8f7;--good:#18a66f;--warn:#e5a23f;--bad:#dc3545
}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.app{max-width:520px;margin:auto;min-height:100vh;padding-bottom:90px}
header{padding:20px 18px 12px;position:sticky;top:0;background:rgba(238,245,255,.95);backdrop-filter:blur(12px);z-index:4}
.brand{font-size:23px;font-weight:800;color:var(--blue)}.sub{font-size:12px;color:var(--muted)}
main{padding:8px 14px 24px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:0 8px 24px rgba(18,73,130,.08)}
.hero{background:linear-gradient(135deg,var(--blue),var(--blue2));color:white}.hero .muted{color:rgba(255,255,255,.8)}
.label{font-size:12px;color:var(--muted)}.hero .label{color:rgba(255,255,255,.8)}.big{font-size:38px;font-weight:800;margin:4px 0 6px}.title{font-size:16px;font-weight:800;margin-bottom:10px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.muted{color:var(--muted)}
.btn{border:0;border-radius:14px;background:var(--blue);color:#fff;padding:12px 14px;font-weight:800}.btn.alt{background:#e9f3ff;color:var(--blue)}
.progress{height:10px;border-radius:99px;background:#e8f0fa;overflow:hidden}.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--blue2),var(--blue))}
.timeline{display:flex;flex-direction:column;gap:9px}.tl{display:grid;grid-template-columns:78px 1fr auto;gap:7px;padding:8px 0;border-bottom:1px solid var(--line)}.tl:last-child{border:0}.pos{color:var(--good)}.neg{color:var(--bad)}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);display:grid;grid-template-columns:1fr 1fr 70px 1fr 1fr;background:white;border-top:1px solid var(--line);padding:8px 10px max(8px,env(safe-area-inset-bottom));z-index:5}
nav button{border:0;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:20px}.nlab{font-size:10px}.active{color:var(--blue)!important;font-weight:800}.fab{width:58px;height:58px;border-radius:50%;background:var(--blue);color:#fff;font-size:34px;margin-top:-27px;border:4px solid white}
dialog{border:0;background:transparent;width:min(460px,92vw)}dialog::backdrop{background:rgba(0,0,0,.45)}.modal{background:#fff;border-radius:22px;padding:20px}.close{float:right;border:0;background:transparent;font-size:24px}
input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;font-size:16px;margin:5px 0 11px;background:#f8fbff}.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice button{padding:18px;border-radius:16px;border:1px solid var(--line);background:#f5f9ff;color:var(--text);text-align:left}.choice strong{display:block;color:var(--blue);margin-bottom:5px}
.bar{margin:12px 0}.barhead{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}.small{font-size:12px}.kpi{font-size:24px;font-weight:800;color:var(--blue)}
.notice{border:1px solid var(--line);background:#f7fbff;border-radius:14px;padding:12px;margin-top:12px}
</style>
</head>
<body>
<div class="app">
<header><div class="brand">Nadhir Finance</div><div class="sub">Mieux gérer aujourd’hui pour aller plus loin demain</div></header>
<main id="view"></main>
<nav>
<button class="active" data-p="home">⌂<span class="nlab">Accueil</span></button>
<button data-p="expenses">▣<span class="nlab">Dépenses</span></button>
<button class="fab" id="plus">＋</button>
<button data-p="bilan">▥<span class="nlab">Bilan</span></button>
<button data-p="settings">⚙<span class="nlab">Réglages</span></button>
</nav>
</div>

<dialog id="dlg"><div class="modal"><button class="close" onclick="dlg.close()">×</button><div id="mb"></div></div></dialog>

<script>
const base={
pay:989,cash:1302.55,floor:2000,accord:6575.23,accord0:10000,rate:12.99,extra:160,
budgets:{Nourriture:92.31,Essence:30,Nicorette:70,Autres:100},
expenses:[],ccp:1953.431,
rec:[
["Loyer Montréal",1200,1],["Épargne ET1",100,1],["Loyer Tunisie",119,1],
["Assurance",45.68,4],["ChatGPT",28.73,4],["HP",9.19,4],["Accord D",227.48,10],
["Netflix",9.19,17],["Bell",179.65,27],["Assurance",45.43,27],["Hydro Québec",-38.39,28]
]};
let s=JSON.parse(localStorage.getItem("nf_onefile")||"null")||base,p="home";
const v=document.getElementById("view"),dlg=document.getElementById("dlg"),mb=document.getElementById("mb");
const cad=n=>new Intl.NumberFormat("fr-CA",{style:"currency",currency:"CAD"}).format(n);
const dt=d=>new Intl.DateTimeFormat("fr-CA",{day:"2-digit",month:"short"}).format(d);
function save(){localStorage.setItem("nf_onefile",JSON.stringify(s));render()}
function upcoming(days=14){
 let a=[],start=new Date();start.setHours(12,0,0,0);
 for(let i=1;i<=days;i++){let d=new Date(start);d.setDate(start.getDate()+i);
   s.rec.forEach(r=>{if(d.getDate()==r[2])a.push({d:new Date(d),n:r[0],a:-r[1]})});
   if(d.getDay()==4){a.push({d:new Date(d),n:"Paie",a:s.pay});a.push({d:new Date(d),n:"Épargne Tunisie",a:-100})}
 }return a.sort((x,y)=>x.d-y.d)
}
function safe(){
 let balance=s.cash;
 let minBalance=balance;

 upcoming(30).forEach(x=>{
   balance+=x.a;
   minBalance=Math.min(minBalance,balance);
 });

 let remainingBudget=Object.keys(s.budgets).reduce((total,k)=>{
   let spent=s.expenses
     .filter(e=>e.category==k && Date.now()-new Date(e.date+"T12:00:00")<7*864e5)
     .reduce((z,e)=>z+Number(e.amount),0);

   return total+Math.max(0,s.budgets[k]-spent);
 },0);

 return Math.max(0,minBalance-s.floor-remainingBudget);
}
function recExtra(){let x=safe();return x>=s.extra?s.extra:x>=80?80:0}
function bars(){
 return Object.keys(s.budgets).map(k=>{
  let spent=s.expenses.filter(e=>e.category==k && Date.now()-new Date(e.date+"T12:00:00")<7*864e5).reduce((z,e)=>z+Number(e.amount),0);
  let b=s.budgets[k],pct=Math.min(100,b?spent/b*100:0);
  return `<div class="bar"><div class="barhead"><span>${k}</span><span>${cad(spent)} / ${cad(b)}</span></div><div class="progress"><span style="width:${pct}%"></span></div></div>`
 }).join("")
}
function home(){
 let sf=safe(),prog=Math.max(0,Math.min(100,(1-s.accord/s.accord0)*100));
 v.innerHTML=`
 <div class="card hero"><div class="label">SAFE TO SPEND</div><div class="big">${cad(sf)}</div><div>${sf>200?"🟢 Situation sous contrôle":sf>0?"🟠 Marge limitée":"🔴 Préservez votre liquidité"}</div></div>
 <div class="card"><div class="row"><div><div class="title">Paie du jeudi</div><div class="muted small">Entrez le montant réel reçu</div></div><button class="btn" onclick="pay()">Entrer</button></div></div>
 <div class="card"><div class="row"><div class="title">Échéances à venir</div><button class="btn alt" onclick="timeline()">30 jours</button></div><div class="timeline">${upcoming(14).slice(0,8).map(x=>`<div class="tl"><span class="muted small">${dt(x.d)}</span><strong>${x.n}</strong><span class="${x.a>=0?'pos':'neg'}">${x.a>=0?'+':''}${cad(x.a)}</span></div>`).join("")}</div></div>
 <div class="card"><div class="row"><div><div class="title">Accord D</div><div class="kpi">${cad(s.accord)}</div></div><strong>${s.rate}%</strong></div><div class="progress" style="margin:12px 0"><span style="width:${prog}%"></span></div><div class="row"><span class="muted">Extra recommandé</span><strong>${cad(recExtra())}</strong></div><div class="row" style="margin-top:6px"><span class="muted">Objectif habituel</span><strong>${cad(s.extra)}/sem</strong></div></div>
 <div class="card"><div class="title">Budget cette semaine</div>${bars()}</div>`
}
function expenses(){
 v.innerHTML=`<div class="card"><div class="row"><div><div class="title">Dépenses</div><div class="muted small">Chaque dépense n'est comptée qu'une fois.</div></div><button class="btn" onclick="expense()">Ajouter</button></div></div>
 <div class="card"><div class="title">Budget de la semaine</div>${bars()}</div>
 <div class="card"><div class="title">Dernières dépenses</div>${s.expenses.length?s.expenses.slice().reverse().map(e=>`<div class="row" style="padding:9px 0;border-bottom:1px solid var(--line)"><div><strong>${e.category}</strong><div class="muted small">${e.date} · ${e.method}</div></div><strong>${cad(Number(e.amount))}</strong></div>`).join(""):'<div class="muted">Aucune dépense enregistrée.</div>'}</div>`
}
function bilan(){v.innerHTML=`<div class="card"><div class="title">Bilan</div><div class="row"><span>Accord D</span><strong>${cad(s.accord)}</strong></div><div class="row" style="margin-top:10px"><span>Épargne Tunisie</span><strong>${s.ccp.toLocaleString("fr-FR",{minimumFractionDigits:3})} TND</strong></div><div class="row" style="margin-top:10px"><span>Plancher sécurité</span><strong>${cad(s.floor)}</strong></div></div><div class="card"><button class="btn" onclick="snapshot()">Mise à jour mensuelle</button></div>`}
function settings(){v.innerHTML=`<div class="card"><div class="title">Réglages</div><label>Solde cash actuel</label><input id="cash" type="number" value="${s.cash}"><label>Plancher de sécurité</label><input id="floor" type="number" value="${s.floor}"><label>Accord D</label><input id="acc" type="number" value="${s.accord}"><label>Extra Accord D / semaine</label><input id="ex" type="number" value="${s.extra}"><button class="btn" onclick="settingsSave()">Enregistrer</button></div>`}
function render(){document.querySelectorAll("nav button[data-p]").forEach(b=>b.classList.toggle("active",b.dataset.p==p));({home,expenses,bilan,settings}[p])()}
function pay(){mb.innerHTML=`<h3>Paie du jeudi</h3><label>Montant reçu</label><input id="pa" type="number" value="${s.pay}"><label>Solde EOP après la paie (optionnel)</label><input id="pc" type="number"><button class="btn" onclick="paySave()">Valider</button>`;dlg.showModal()}
function paySave(){s.pay=Number(pa.value||0);if(Number(pc.value)>0)s.cash=Number(pc.value);dlg.close();save()}
function expense(){mb.innerHTML=`<h3>J’ai dépensé</h3><label>Montant</label><input id="ea" type="number"><label>Date</label><input id="ed" type="date" value="${new Date().toISOString().slice(0,10)}"><label>Catégorie</label><select id="ec"><option>Nourriture</option><option>Essence</option><option>Nicorette</option><option>Auto</option><option>Maison</option><option>Loisirs</option><option>Autres</option></select><label>Mode de paiement</label><select id="em"><option>Mastercard</option><option>EOP</option><option>Comptant</option></select><button class="btn" onclick="expenseSave()">Enregistrer</button>`;dlg.showModal()}
function expenseSave(){if(Number(ea.value)<=0)return;s.expenses.push({amount:Number(ea.value),date:ed.value,category:ec.value,method:em.value});dlg.close();save()}
function plus(){mb.innerHTML=`<h3>Que voulez-vous faire ?</h3><div class="choice"><button onclick="expense()"><strong>J’ai dépensé</strong><span class="small muted">Enregistrer une dépense</span></button><button onclick="buy()"><strong>Je veux acheter</strong><span class="small muted">Simuler un achat</span></button></div>`;dlg.showModal()}
function buy(){mb.innerHTML=`<h3>Simulation d'achat</h3><label>Montant</label><input id="ba" type="number"><label>Date souhaitée (optionnelle)</label><input id="bd" type="date"><button class="btn" onclick="buyCalc()">Analyser</button><div id="br"></div>`;dlg.showModal()}
function buyCalc(){let a=Number(ba.value||0),target=bd.value,html="";if(target){let td=new Date(target+"T12:00:00"),days=Math.max(0,Math.ceil((td-new Date())/864e5)),future=s.cash+upcoming(days).reduce((z,x)=>z+x.a,0),ok=future-a>=s.floor;html=`<div class="notice"><strong>${ok?"🟢 Achat réalisable":"🟠 Date trop tôt"}</strong><div class="small muted" style="margin-top:6px">${ok?"Le plancher de sécurité reste protégé.":"L’achat ferait passer la liquidité sous le plancher de sécurité."}</div></div>`}else{let found=null;for(let d=0;d<=365;d++){let future=s.cash+upcoming(d).reduce((z,x)=>z+x.a,0);if(future-a>=s.floor){let x=new Date();x.setDate(x.getDate()+d);found=x;break}}html=`<div class="notice"><strong>${found?"Date recommandée : "+found.toLocaleDateString("fr-CA"):"Aucune date sûre trouvée sur 12 mois"}</strong></div>`}br.innerHTML=html}
function timeline(){mb.innerHTML=`<h3>Timeline · 30 jours</h3><div class="timeline">${upcoming(30).map(x=>`<div class="tl"><span class="muted small">${dt(x.d)}</span><strong>${x.n}</strong><span class="${x.a>=0?'pos':'neg'}">${x.a>=0?'+':''}${cad(x.a)}</span></div>`).join("")}</div>`;dlg.showModal()}
function snapshot(){mb.innerHTML=`<h3>Mise à jour mensuelle</h3><label>EOP</label><input id="se" type="number"><label>ET1</label><input id="st" type="number"><label>Accord D</label><input id="sa" type="number" value="${s.accord}"><label>CCP Tunisie (TND)</label><input id="sc" type="number" value="${s.ccp}"><button class="btn" onclick="snapSave()">Enregistrer</button>`;dlg.showModal()}
function snapSave(){s.cash=Number(se.value||0)+Number(st.value||0);s.accord=Number(sa.value||0);s.ccp=Number(sc.value||0);dlg.close();save()}
function settingsSave(){s.cash=Number(cash.value||0);s.floor=Number(floor.value||0);s.accord=Number(acc.value||0);s.extra=Number(ex.value||0);save()}
document.querySelectorAll("nav button[data-p]").forEach(b=>b.onclick=()=>{p=b.dataset.p;render()});document.getElementById("plus").onclick=plus;render()
</script>
</body></html>
