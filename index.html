<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08131f">
<title>Nadhir Finance V2 — Phase 3I</title>
<style>
:root{
  --bg:#07111c;--panel:#0c1927;--panel2:#102236;--card:#0f2134;--line:#213a52;
  --text:#f4f7fb;--muted:#8ea4b9;--blue:#2e8cff;--blue2:#6ab5ff;
  --good:#2ac37d;--warn:#f1b84b;--bad:#ef6472;--shadow:0 12px 28px rgba(0,0,0,.26)
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select{font:inherit}button{cursor:pointer}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:90px}
header{position:sticky;top:0;z-index:10;padding:18px 16px 12px;background:rgba(7,17,28,.95);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.04)}
.brand{font-size:24px;font-weight:900}.brand span{color:var(--blue)}.sub{font-size:12px;color:var(--muted);margin-top:3px}
main{padding:14px}
.card{background:linear-gradient(180deg,var(--card),var(--panel));border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.hero{background:linear-gradient(135deg,#0d3f76,#125fae 52%,#2287de);border-color:#2c78bc}
.title{font-size:16px;font-weight:850;margin-bottom:10px}.eyebrow{font-size:11px;letter-spacing:.11em;text-transform:uppercase;font-weight:800;color:#afd2f1}
.big{font-size:38px;font-weight:900;margin:5px 0}.muted{color:var(--muted)}.small{font-size:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{min-width:0;padding:12px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.025)}
.kpi .value{font-size:21px;font-weight:900;margin-top:4px;overflow-wrap:anywhere}
.badge{display:inline-flex;align-items:center;gap:6px;padding:6px 9px;border-radius:999px;font-size:11px;font-weight:800;background:#14324d;border:1px solid #2b5273;color:#c4e3ff}
.badge.good{background:#113928;border-color:#245c44;color:#c3f3d9}.badge.warn{background:#4b3915;border-color:#705821;color:#ffe4a7}.badge.bad{background:#4e2029;border-color:#7a2e3a;color:#ffdce2}
.btn{border:0;border-radius:13px;background:var(--blue);color:#fff;padding:12px 14px;font-weight:850}
.btn.alt{background:#17334e;border:1px solid #2d526f;color:#dcefff}.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
.btn.bad{background:#57212b;border:1px solid #7a2e3a;color:#ffdde2}.btn:disabled{opacity:.45;cursor:not-allowed}
.form-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
label{display:block;margin:10px 0 5px;font-size:12px;color:#b0c4d5}
input,select{width:100%;border:1px solid var(--line);border-radius:12px;background:#091725;color:var(--text);padding:12px;font-size:16px;outline:none}
input:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(46,140,255,.14)}
.list{display:flex;flex-direction:column;gap:9px}.item{border:1px solid var(--line);border-radius:15px;background:#0b1b2a;padding:12px}
.item .name{font-weight:850}.item .meta{font-size:12px;color:var(--muted);margin-top:3px}.item .amount{font-weight:900}
.note{padding:11px;border-radius:14px;border:1px solid #34516b;background:#0c2134;color:#c7d7e6;font-size:12px}
.empty{text-align:center;padding:18px;border:1px dashed #31506a;border-radius:16px;color:var(--muted)}
.steps{display:flex;gap:6px;margin-bottom:14px}.step{height:5px;flex:1;background:#183149;border-radius:999px}.step.on{background:var(--blue)}
.tree{display:flex;flex-direction:column;gap:8px}.tree-row{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);background:#0d2031;border-radius:15px;padding:13px}
.tree-row strong{font-size:14px}.tree-row .count{font-size:12px;color:var(--muted)}
.tree-main{flex:1;min-width:0}.tree-open{border:0;background:transparent;color:var(--text);padding:0;text-align:left;width:100%}
.actions3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.action{min-height:72px;border:1px solid var(--line);border-radius:18px;background:#0e2336;color:var(--text);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;font-weight:850}
.action .symbol{font-size:26px;color:var(--blue2)}
.status-line{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.rule-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.calendar-day{font-size:12px;font-weight:850;color:#9fc7e8;margin:13px 2px 6px}
.event{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border:1px solid var(--line);background:#0b1b2a;border-radius:15px;padding:12px}
.event-name{font-weight:850}.event-meta{font-size:12px;color:var(--muted);margin-top:3px}.event-amount{font-weight:900;white-space:nowrap}.event-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.btn.mini{padding:7px 10px;border-radius:10px;font-size:11px}
.event-amount.in{color:#8fe4b8}.event-amount.out{color:#ffc0c7}
nav[hidden]{display:none!important}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(560px,100%);display:grid;grid-template-columns:repeat(5,1fr);background:rgba(8,19,31,.97);border-top:1px solid var(--line);padding:8px 8px max(8px,env(safe-area-inset-bottom));z-index:20}
nav button{border:0;background:transparent;color:#788fa6;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:18px}
nav button.active{color:var(--blue2)}nav .lab{font-size:10px}
dialog{width:min(500px,94vw);border:0;padding:0;background:transparent;color:var(--text)}dialog::backdrop{background:rgba(0,0,0,.67);backdrop-filter:blur(2px)}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--shadow)}.modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.close{border:0;background:transparent;color:var(--muted);font-size:26px;padding:3px 8px}.hr{height:1px;background:var(--line);margin:14px 0}
.inline-check{display:flex;align-items:center;gap:9px;margin-top:12px}.inline-check input{width:auto;transform:scale(1.15)}
@media (max-width:390px){.grid2,.actions3{grid-template-columns:1fr}.big{font-size:32px}}
</style>
</head>
<body>
<div class="app">
<header><div class="brand">Nadhir <span>Finance</span></div><div class="sub" id="headerSub">V2 · Phase 3I</div></header>
<main id="view"></main>
<nav id="nav" hidden>
  <button data-page="home" class="active">⌂<span class="lab">Accueil</span></button>
  <button data-page="history">≡<span class="lab">Historique</span></button>
  <button data-page="manage">⌘<span class="lab">Gérer</span></button>
  <button data-page="projects">◇<span class="lab">Projets</span></button>
  <button data-page="more">•••<span class="lab">Plus</span></button>
</nav>
</div>
<dialog id="dlg">
  <div class="modal">
    <div class="modal-head"><div class="title" id="dlgTitle"></div><button class="close" id="dlgClose" aria-label="Fermer">×</button></div>
    <div id="dlgBody"></div>
  </div>
</dialog>

<script>
(() => {
"use strict";

const DB_NAME="nadhir_finance_v2";
const DB_VERSION=5;
const STORE_ACCOUNTS="accounts";
const STORE_META="meta";
const STORE_RULES="rules";
const STORE_EVENTS="events";
const STORE_TRANSACTIONS="transactions";
const STORE_CLOSURES="closures";
const STORE_PROJECTS="projects";

const defaultSettings={
  cycleDay:2,
  mainCurrency:"CAD",
  safetyReserve:0,
  primaryAccountId:null,
  balanceReferenceDate:null,
  activeCycleStart:null,
  dataVersion:5
};

const ruleLabels={
  fixed_income:"Revenus fixes",
  debit:"Prélèvements",
  reserved_budget:"Budgets réservés",
  transfer:"Virements programmés"
};

let db=null,page="home",manageSection=null,onboardingStep=1;
const state={accounts:[],rules:[],eventRecords:[],transactions:[],closures:[],projects:[],settings:null,onboardingComplete:false,reserveInit:null,reserveCarry:null};
const view=document.getElementById("view"),nav=document.getElementById("nav"),dlg=document.getElementById("dlg"),
dlgTitle=document.getElementById("dlgTitle"),dlgBody=document.getElementById("dlgBody"),dlgClose=document.getElementById("dlgClose"),
headerSub=document.getElementById("headerSub");

function uid(){return (window.crypto&&crypto.randomUUID)?crypto.randomUUID():"id-"+Date.now()+"-"+Math.random().toString(16).slice(2)}
function safeText(str=""){return String(str).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function digitsFor(currency){return currency==="TND"?3:2}
function money(n,currency="CAD"){const d=digitsFor(currency);return new Intl.NumberFormat("fr-CA",{style:"currency",currency,minimumFractionDigits:d,maximumFractionDigits:d}).format(Number(n||0))}
function maxDayInMonth(y,m){return new Date(y,m+1,0).getDate()}
function fmtDate(d){return new Intl.DateTimeFormat("fr-CA",{day:"2-digit",month:"short",year:"numeric"}).format(d)}
function fmtDay(d){return new Intl.DateTimeFormat("fr-CA",{weekday:"short",day:"2-digit",month:"short"}).format(d)}
function localToday(){const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate(),12)}
function isoLocal(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function dateFromISO(s){return s?new Date(s+"T12:00:00"):null}
function sameDay(a,b){return a&&b&&a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate()}

function cycleRange(day){
  const now=localToday(),y=now.getFullYear(),m=now.getMonth(),thisDay=Math.min(day,maxDayInMonth(y,m));
  let start,end;
  if(now.getDate()>=thisDay){
    start=new Date(y,m,thisDay,12);
    const nm=m===11?0:m+1,ny=m===11?y+1:y;
    end=new Date(ny,nm,Math.min(day,maxDayInMonth(ny,nm)),12)
  }else{
    const pm=m===0?11:m-1,py=m===0?y-1:y;
    start=new Date(py,pm,Math.min(day,maxDayInMonth(py,pm)),12);
    end=new Date(y,m,thisDay,12)
  }
  return{start,end}
}

function nextCycleBoundary(start,day=(state.settings||defaultSettings).cycleDay||2){
  let y=start.getFullYear(),m=start.getMonth()+1;if(m>11){m=0;y++}
  return new Date(y,m,Math.min(day,maxDayInMonth(y,m)),12)
}
function activeCycleRange(){
  const s=state.settings||defaultSettings;
  const start=s.activeCycleStart?dateFromISO(s.activeCycleStart):cycleRange(s.cycleDay||2).start;
  return {start,end:nextCycleBoundary(start,s.cycleDay||2)}
}
function closureDue(){
  const r=activeCycleRange(),today=localToday();return today>=r.end
}
function reserveCarryMetaKey(range=activeCycleRange()){return `reserveCarry:${isoLocal(range.start)}`}

function openDB(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open(DB_NAME,DB_VERSION);
    req.onupgradeneeded=e=>{
      const d=e.target.result;
      if(!d.objectStoreNames.contains(STORE_ACCOUNTS))d.createObjectStore(STORE_ACCOUNTS,{keyPath:"id"});
      if(!d.objectStoreNames.contains(STORE_META))d.createObjectStore(STORE_META,{keyPath:"key"});
      if(!d.objectStoreNames.contains(STORE_RULES))d.createObjectStore(STORE_RULES,{keyPath:"id"});
      if(!d.objectStoreNames.contains(STORE_EVENTS))d.createObjectStore(STORE_EVENTS,{keyPath:"id"});
      if(!d.objectStoreNames.contains(STORE_TRANSACTIONS))d.createObjectStore(STORE_TRANSACTIONS,{keyPath:"id"});
      if(!d.objectStoreNames.contains(STORE_CLOSURES))d.createObjectStore(STORE_CLOSURES,{keyPath:"id"});
      if(!d.objectStoreNames.contains(STORE_PROJECTS))d.createObjectStore(STORE_PROJECTS,{keyPath:"id"});
    };
    req.onsuccess=e=>resolve(e.target.result);
    req.onerror=()=>reject(req.error)
  })
}
function store(name,mode="readonly"){return db.transaction(name,mode).objectStore(name)}
function getAll(name){return new Promise((resolve,reject)=>{const r=store(name).getAll();r.onsuccess=()=>resolve(r.result||[]);r.onerror=()=>reject(r.error)})}
function getOne(name,key){return new Promise((resolve,reject)=>{const r=store(name).get(key);r.onsuccess=()=>resolve(r.result||null);r.onerror=()=>reject(r.error)})}
function putOne(name,value){return new Promise((resolve,reject)=>{const r=store(name,"readwrite").put(value);r.onsuccess=()=>resolve(value);r.onerror=()=>reject(r.error)})}

async function loadState(){
  state.accounts=await getAll(STORE_ACCOUNTS);
  state.rules=await getAll(STORE_RULES);
  state.eventRecords=await getAll(STORE_EVENTS);
  state.transactions=await getAll(STORE_TRANSACTIONS);
  state.closures=await getAll(STORE_CLOSURES);
  state.projects=await getAll(STORE_PROJECTS);
  const s=await getOne(STORE_META,"settings"),o=await getOne(STORE_META,"onboardingComplete");
  state.settings=s?s.value:null;
  state.onboardingComplete=!!(o&&o.value);
  state.reserveInit=null;state.reserveCarry=null;
  if(state.settings){
    const rr=activeCycleRange();
    const ri=await getOne(STORE_META,`reserveInit:${isoLocal(rr.start)}`);
    const rc=await getOne(STORE_META,reserveCarryMetaKey(rr));
    state.reserveInit=ri?ri.value:null;
    state.reserveCarry=rc?rc.value:null
  }
}
function activeAccounts(){return state.accounts.filter(a=>!a.archived)}
function primaryAccount(){const id=state.settings?.primaryAccountId;return activeAccounts().find(a=>a.id===id)||activeAccounts().find(a=>a.role==="primary_spending")||null}
function accountById(id){return state.accounts.find(a=>a.id===id)||null}
function activeRules(type=null){return state.rules.filter(r=>!r.archived&&r.status!=="frozen"&&(!type||r.type===type))}
function visibleRules(type=null){return state.rules.filter(r=>!r.archived&&(!type||r.type===type))}
function ruleCount(type){return visibleRules(type).length}
function statusBadge(rule){return rule.status==="frozen"?'<span class="badge warn">Gelé</span>':'<span class="badge good">Actif</span>'}
function openModal(title,html){dlgTitle.textContent=title;dlgBody.innerHTML=html;dlg.showModal()}
function closeModal(){dlg.close()}
dlgClose.addEventListener("click",closeModal);

function frequencyFields(rule={}){
  const f=rule.frequency||"monthly";
  let extra="";
  if(f==="weekly"){
    extra=`<label>Jour de la semaine</label><select id="ruleWeekday">${["Dimanche","Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi"].map((n,i)=>`<option value="${i}" ${Number(rule.weekday)===i?"selected":""}>${n}</option>`).join("")}</select>`;
  }else if(f==="biweekly"){
    extra=`<label>Date de référence</label><input id="ruleReferenceDate" type="date" value="${rule.referenceDate||""}" required><div class="muted small">Le rythme de 14 jours part de cette date.</div>`;
  }else if(f==="monthly"){
    extra=`<label>Jour du mois</label><input id="ruleMonthDay" type="number" min="1" max="28" value="${rule.monthDay||1}" required>`;
  }else if(f==="annual"){
    extra=`<label>Date annuelle</label><input id="ruleAnnualDate" type="date" value="${rule.annualDate||""}" required><div class="muted small">L'année de cette date sert seulement de référence; le mois et le jour se répètent chaque année.</div>`;
  }
  return extra;
}
function scheduleSummary(r){
  if(r.frequency==="weekly") return "Hebdomadaire · "+(["dim.","lun.","mar.","mer.","jeu.","ven.","sam."][Number(r.weekday)||0]);
  if(r.frequency==="biweekly") return "Aux 2 semaines · réf. "+(r.referenceDate||"—");
  if(r.frequency==="monthly") return "Mensuel · le "+r.monthDay;
  if(r.frequency==="annual"){
    const d=r.annualDate?dateFromISO(r.annualDate):null;
    return "Annuel · "+(d?new Intl.DateTimeFormat("fr-CA",{day:"2-digit",month:"short"}).format(d):"—");
  }
  return r.frequency||"—"
}
function executionSummary(r){return r.executionMode==="confirm"?"À confirmer":"Automatique"}

function accountForm(account=null,onboarding=false){
  const hasPrimary=activeAccounts().some(a=>a.role==="primary_spending"&&a.id!==account?.id);
  const chosenRole=account?.role||(hasPrimary?"protected_savings":"primary_spending");
  return `<form id="accountForm">
    <label>Nom du compte</label><input id="accName" required maxlength="60" value="${safeText(account?.name||"")}" placeholder="Ex. EOP">
    <label>Type</label><select id="accType">
      <option value="current" ${account?.type==="current"?"selected":""}>Compte courant</option>
      <option value="savings" ${account?.type==="savings"?"selected":""}>Épargne</option>
      <option value="tracking" ${account?.type==="tracking"?"selected":""}>Suivi seulement</option>
      <option value="other" ${account?.type==="other"?"selected":""}>Autre</option>
    </select>
    <label>Devise</label><select id="accCurrency">${["CAD","TND","USD","EUR"].map(c=>`<option value="${c}" ${(account?.currency||"CAD")===c?"selected":""}>${c}</option>`).join("")}</select>
    <label>Solde actuel</label><input id="accBalance" type="number" step="${(account?.currency||"CAD")==="TND"?"0.001":"0.01"}" required value="${account?.balance??""}" placeholder="${(account?.currency||"CAD")==="TND"?"0.000":"0.00"}">
    <label>Rôle</label><select id="accRole">
      <option value="primary_spending" ${chosenRole==="primary_spending"?"selected":""}>Compte principal de dépenses</option>
      <option value="protected_savings" ${chosenRole==="protected_savings"?"selected":""}>Épargne protégée</option>
      <option value="tracking_only" ${chosenRole==="tracking_only"?"selected":""}>Suivi seulement</option>
    </select>
    <div class="note" style="margin-top:10px">Le compte principal servira au moteur Safe to Spend.</div>
    <div class="form-actions"><button class="btn" type="submit">${account?"Enregistrer":"Ajouter le compte"}</button>${onboarding?"":'<button type="button" class="btn ghost" id="cancelAcc">Annuler</button>'}</div>
  </form>`
}
async function saveAccount(existing=null){
  const name=document.getElementById("accName").value.trim(),
        type=document.getElementById("accType").value,
        currency=document.getElementById("accCurrency").value,
        balance=Number(document.getElementById("accBalance").value),
        role=document.getElementById("accRole").value;
  if(!name||!Number.isFinite(balance)){alert("Vérifiez le nom et le solde.");return}
  if(role==="primary_spending"){
    for(const a of state.accounts){
      if(a.id!==existing?.id&&a.role==="primary_spending"&&!a.archived){
        a.role="protected_savings";
        await putOne(STORE_ACCOUNTS,a)
      }
    }
  }
  const obj={id:existing?.id||uid(),name,type,currency,balance,role,archived:existing?.archived||false,createdAt:existing?.createdAt||new Date().toISOString(),updatedAt:new Date().toISOString()};
  await putOne(STORE_ACCOUNTS,obj);
  await loadState();
  if(role==="primary_spending"){
    state.settings={...defaultSettings,...(state.settings||{}),primaryAccountId:obj.id,dataVersion:5};
    await putOne(STORE_META,{key:"settings",value:state.settings})
  }
  closeModal();render()
}
function bindAccountForm(existing=null){
  const form=document.getElementById("accountForm");if(!form)return;
  const currencySelect=document.getElementById("accCurrency"),balanceInput=document.getElementById("accBalance");
  function updatePrecision(){const tnd=currencySelect?.value==="TND";if(balanceInput){balanceInput.step=tnd?"0.001":"0.01";balanceInput.placeholder=tnd?"0.000":"0.00"}}
  currencySelect?.addEventListener("change",updatePrecision);updatePrecision();
  form.addEventListener("submit",e=>{e.preventDefault();saveAccount(existing)});
  document.getElementById("cancelAcc")?.addEventListener("click",closeModal)
}

function commonRuleFields(rule={}){
  const accountOptions=activeAccounts().map(a=>`<option value="${a.id}" ${rule.accountId===a.id?"selected":""}>${safeText(a.name)} · ${a.currency}</option>`).join("");
  return `
    <label>Nom</label><input id="ruleName" required maxlength="70" value="${safeText(rule.name||"")}">
    <label>Montant</label><input id="ruleAmount" type="number" min="0" step="0.01" required value="${rule.amount??""}">
    <label>Fréquence</label><select id="ruleFrequency">
      <option value="weekly" ${rule.frequency==="weekly"?"selected":""}>Hebdomadaire</option>
      <option value="biweekly" ${rule.frequency==="biweekly"?"selected":""}>Aux 2 semaines</option>
      <option value="monthly" ${(!rule.frequency||rule.frequency==="monthly")?"selected":""}>Mensuelle</option>
      <option value="annual" ${rule.frequency==="annual"?"selected":""}>Annuelle</option>
    </select>
    <div id="frequencyExtra">${frequencyFields(rule.frequency?rule:{...rule,frequency:"monthly"})}</div>
    <label>Compte</label><select id="ruleAccount">${accountOptions}</select>
  `
}
function ruleForm(type,rule=null){
  const r=rule||{type,status:"active",executionMode:"auto",frequency:"monthly"};
  if(type==="fixed_income"||type==="debit"){
    const roleLabel=type==="fixed_income"?"Compte destination":"Compte source";
    return `<form id="ruleForm">${commonRuleFields(r).replace("<label>Compte</label>",`<label>${roleLabel}</label>`)}
      <label>Mode d’exécution</label><select id="ruleExecution">
        <option value="auto" ${r.executionMode!=="confirm"?"selected":""}>Automatique</option>
        <option value="confirm" ${r.executionMode==="confirm"?"selected":""}>À confirmer</option>
      </select>
      <div class="form-actions"><button class="btn" type="submit">Enregistrer</button><button class="btn ghost" type="button" id="cancelRule">Annuler</button></div>
    </form>`
  }
  if(type==="reserved_budget"){
    return `<form id="ruleForm">
      <label>Nom</label><input id="ruleName" required maxlength="70" value="${safeText(r.name||"")}">
      <label>Montant réservé</label><input id="ruleAmount" type="number" min="0" step="0.01" required value="${r.amount??""}">
      <label>Fréquence</label><select id="ruleFrequency">
        <option value="weekly" ${r.frequency==="weekly"?"selected":""}>Hebdomadaire</option>
        <option value="monthly" ${(!r.frequency||r.frequency==="monthly")?"selected":""}>Mensuelle</option>

function readSchedule(){
  const frequency=document.getElementById("ruleFrequency").value;
  const out={frequency};
  if(frequency==="weekly") out.weekday=Number(document.getElementById("ruleWeekday").value);
  if(frequency==="biweekly") out.referenceDate=document.getElementById("ruleReferenceDate").value;
  if(frequency==="monthly") out.monthDay=Math.max(1,Math.min(28,Number(document.getElementById("ruleMonthDay").value)||1));
  if(frequency==="annual") out.annualDate=document.getElementById("ruleAnnualDate").value;
  return out
}

/* ===== Phase 3I : calendrier + EOP calculé ===== */
function occurrenceDates(rule,start,end){
  const out=[];
  const pushIf=d=>{if(d>=start&&d<end)out.push(d)};
  if(rule.frequency==="weekly"){
    const d=new Date(start);
    while(d.getDay()!==Number(rule.weekday))d.setDate(d.getDate()+1);
    for(;d<end;d.setDate(d.getDate()+7))pushIf(new Date(d))
  }else if(rule.frequency==="biweekly"){
    const ref=dateFromISO(rule.referenceDate);
    if(!ref)return out;
    let d=new Date(ref);
    if(d<start){
      const days=Math.floor((start-d)/86400000);
      const jumps=Math.floor(days/14);
      d.setDate(d.getDate()+jumps*14);
      while(d<start)d.setDate(d.getDate()+14)
    }
    for(;d<end;d.setDate(d.getDate()+14))pushIf(new Date(d))
  }else if(rule.frequency==="monthly"){
    let y=start.getFullYear(),m=start.getMonth();
    while(new Date(y,m,1,12)<end){
      const day=Math.min(Number(rule.monthDay)||1,maxDayInMonth(y,m));
      pushIf(new Date(y,m,day,12));
      m++;if(m>11){m=0;y++}
    }
  }else if(rule.frequency==="annual"){
    const ref=dateFromISO(rule.annualDate);
    if(!ref)return out;
    for(let y=start.getFullYear();y<=end.getFullYear();y++){
      const d=new Date(y,ref.getMonth(),Math.min(ref.getDate(),maxDayInMonth(y,ref.getMonth())),12);
      pushIf(d)
    }
  }
  return out
}

function ruleToEvent(r,d){
  let direction="out",accountId=null,destinationId=null;
  if(r.type==="fixed_income"){direction="in";accountId=r.accountId}
  else if(r.type==="debit"){direction="out";accountId=r.accountId}
  else {direction="out";accountId=r.sourceAccountId;destinationId=r.destinationAccountId}
  return {
    id:`${r.id}__${isoLocal(d)}`,
    ruleId:r.id,
    type:r.type,
    name:r.name,
    amount:Number(r.amount)||0,
    currency:ruleCurrency(r),
    destinationCurrency:destinationId?accountById(destinationId)?.currency||null:null,
    date:d,
    dateISO:isoLocal(d),
    direction,
    accountId,
    destinationId,
    executionMode:r.executionMode||"auto"
  }
}

function snapshotToEvent(rec){
  return {
    id:rec.id,ruleId:rec.ruleId,type:rec.type,name:rec.name,
    amount:Number(rec.plannedAmount??rec.amount??0),currency:rec.currency||state.settings?.mainCurrency||"CAD",
    destinationCurrency:rec.destinationCurrency||null,date:dateFromISO(rec.dateISO),dateISO:rec.dateISO,
    direction:rec.direction||"out",accountId:rec.accountId||null,destinationId:rec.destinationId||null,
    executionMode:rec.executionMode||"auto",record:rec
  }
}

function generateEventsBetween(start,end){
  const ref=dateFromISO(state.settings?.balanceReferenceDate);
  const events=[];
  for(const r of activeRules()){
    if(!["fixed_income","debit","transfer"].includes(r.type))continue;
    for(const d of occurrenceDates(r,start,end)){
      if(ref&&d<=ref)continue;
      events.push(ruleToEvent(r,d))
    }
  }
  events.sort((a,b)=>{
    const dd=a.date-b.date;
    if(dd!==0)return dd;
    if(a.direction!==b.direction)return a.direction==="out"?-1:1;
    return a.name.localeCompare(b.name,"fr")
  });
  return events
}

function generateCycleEvents(){
  const s=state.settings||defaultSettings;
  const range=activeCycleRange();
  const ref=dateFromISO(s.balanceReferenceDate);
  if(!ref)return {range,reference:null,events:[]};
  const generated=generateEventsBetween(range.start,range.end);
  const map=new Map(generated.map(e=>[e.id,e]));
  for(const rec of state.eventRecords){
    const d=dateFromISO(rec.dateISO);
    if(!d||d<range.start||d>=range.end)continue;
    if(d<=ref&&!rec.afterReference&&rec.status!=="included_baseline")continue;
    map.set(rec.id,snapshotToEvent(rec)); // snapshots historiques et pont de clôture
  }
  const events=[...map.values()].sort((a,b)=>{
    const dd=a.date-b.date;
    if(dd!==0)return dd;
    if(a.direction!==b.direction)return a.direction==="out"?-1:1;
    return a.name.localeCompare(b.name,"fr")
  });
  return {range,reference:ref,events}
}

function eventRecordById(id){return state.eventRecords.find(r=>r.id===id)||null}
function eventSnapshot(e,status){
  return {
    id:e.id,ruleId:e.ruleId,type:e.type,name:e.name,plannedAmount:Number(e.amount)||0,currency:e.currency,
    destinationCurrency:e.destinationCurrency||null,dateISO:e.dateISO,direction:e.direction,accountId:e.accountId||null,
    destinationId:e.destinationId||null,executionMode:e.executionMode||"auto",status,
    createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()
  }
}

async function syncDueEvents(){
  const s=state.settings||defaultSettings,ref=dateFromISO(s.balanceReferenceDate);
  if(!ref)return;
  const today=localToday(),tomorrow=new Date(today);tomorrow.setDate(tomorrow.getDate()+1);
  const range=activeCycleRange();
  const end=tomorrow<range.end?tomorrow:range.end;
  const start=new Date(ref);start.setDate(start.getDate()+1);
  if(start>=end)return;
  const existing=new Set(state.eventRecords.map(r=>r.id));
  const due=generateEventsBetween(start,end);
  let changed=false;
  for(const e of due){
    if(existing.has(e.id))continue;
    const rec=eventSnapshot(e,e.executionMode==="confirm"?"pending":"calculated");
    await putOne(STORE_EVENTS,rec);existing.add(e.id);changed=true
  }
  if(changed)state.eventRecords=await getAll(STORE_EVENTS)
}

function effectiveEventState(e){
  const rec=e.record||eventRecordById(e.id),today=localToday();
  if(rec?.status==="cancelled")return {status:"cancelled",apply:false,record:rec,amount:0};
  if(rec?.status==="included_baseline")return {status:"included_baseline",apply:false,record:rec,amount:Number(rec.actualAmount??rec.plannedAmount??0)};
  if(rec?.status==="confirmed")return {status:"confirmed",apply:true,record:rec,amount:Number(rec.actualAmount??e.amount)};
  if(rec?.status==="corrected")return {status:"corrected",apply:true,record:rec,amount:Number(rec.actualAmount??e.amount)};
  if(rec?.status==="calculated")return {status:"calculated",apply:true,record:rec,amount:Number(rec.plannedAmount??e.amount)};
  if(rec?.status==="pending")return {status:"pending",apply:false,record:rec,amount:0};
  if(e.date>today)return {status:"planned",apply:false,record:null,amount:Number(e.amount)};
  if(e.executionMode==="confirm")return {status:"pending",apply:false,record:null,amount:0};
  return {status:"calculated",apply:true,record:null,amount:Number(e.amount)}
}

function recordImpactOnPrimary(rec){
  const pa=primaryAccount();if(!pa)return 0;
  const status=rec.status;
  if(status==="pending"||status==="cancelled"||status==="included_baseline")return 0;
  const amount=(status==="confirmed"||status==="corrected")?Number(rec.actualAmount??rec.plannedAmount??0):Number(rec.plannedAmount??0);
  if(rec.type==="fixed_income"&&rec.accountId===pa.id)return amount;
  if(rec.type==="debit"&&rec.accountId===pa.id)return -amount;
  if(rec.type==="transfer"){
    let impact=0;
    if(rec.accountId===pa.id)impact-=amount;
    if(rec.destinationId===pa.id){
      const destAmount=Number(rec.actualDestinationAmount);
      if(Number.isFinite(destAmount))impact+=destAmount;
      else if(rec.currency===pa.currency)impact+=amount;
    }
    return impact
  }
  return 0
}

function activeTransactions(){
  return state.transactions.filter(t=>t.status!=="cancelled")
}
function transactionImpactOnPrimary(t){
  const pa=primaryAccount();if(!pa||t.status==="cancelled")return 0;
  const amount=Number(t.amount)||0;
  if(t.type==="expense"&&t.sourceAccountId===pa.id)return -amount;
  if(t.type==="income"&&t.destinationAccountId===pa.id)return amount;
  return 0
}
function transactionsSinceReference(){
  const ref=dateFromISO(state.settings?.balanceReferenceDate),today=localToday();
  if(!ref)return [];
  const range=activeCycleRange();
  return activeTransactions().filter(t=>{
    const d=dateFromISO(t.dateISO);
    return d&&d>=ref&&d<=today&&d>=range.start&&d<range.end
  })
}
function budgetSpentSinceReference(ruleId){
  return transactionsSinceReference()
    .filter(t=>t.type==="expense"&&t.budgetRuleId===ruleId)
    .reduce((sum,t)=>sum+(Number(t.amount)||0),0)
}
function calculateEOP(){
  const pa=primaryAccount(),s=state.settings||defaultSettings,ref=dateFromISO(s.balanceReferenceDate),today=localToday();
  if(!pa||!ref)return {available:false,calculated:null,baseline:pa?.balance??null,impact:0,eventImpact:0,transactionImpact:0,pending:0};
  let eventImpact=0,pending=0,applied=0;
  const range=activeCycleRange();
  for(const rec of state.eventRecords){
    const d=dateFromISO(rec.dateISO);if(!d||d>today||d<range.start||d>=range.end)continue;
    if(d<=ref&&!rec.afterReference)continue;
    if(rec.status==="pending")pending++;
    const v=recordImpactOnPrimary(rec);eventImpact+=v;if(v!==0)applied++
  }
  const transactionImpact=transactionsSinceReference().reduce((sum,t)=>sum+transactionImpactOnPrimary(t),0);
  const impact=eventImpact+transactionImpact;
  return {available:true,baseline:Number(pa.balance)||0,calculated:(Number(pa.balance)||0)+impact,impact,eventImpact,transactionImpact,pending,applied,reference:ref,currency:pa.currency}
}

/* ===== Phase 3I : Réservé ===== */
function roundCurrency(n,currency="CAD"){
  const d=digitsFor(currency),m=Math.pow(10,d);return Math.round((Number(n)||0)*m)/m
}
function reserveMetaKey(range=activeCycleRange()){
  return `reserveInit:${isoLocal(range.start)}`
}
function nextAnnualDue(rule,from=localToday()){
  const ref=dateFromISO(rule.annualDate);if(!ref)return null;
  let y=from.getFullYear();
  let d=new Date(y,ref.getMonth(),Math.min(ref.getDate(),maxDayInMonth(y,ref.getMonth())),12);
  if(d<=from){y++;d=new Date(y,ref.getMonth(),Math.min(ref.getDate(),maxDayInMonth(y,ref.getMonth())),12)}
  return d
}
function cycleSlotsUntil(due,range=activeCycleRange()){
  if(!due)return 0;
  const day=(state.settings||defaultSettings).cycleDay||2;
  let d=new Date(range.start),count=0,guard=0;
  while(d<due&&guard<240){
    count++;guard++;
    let y=d.getFullYear(),m=d.getMonth()+1;if(m>11){m=0;y++}
    d=new Date(y,m,Math.min(day,maxDayInMonth(y,m)),12)
  }
  return Math.max(1,count)
}
function reserveInitializationRequired(){
  const s=state.settings||defaultSettings,range=activeCycleRange(),ref=dateFromISO(s.balanceReferenceDate),pa=primaryAccount();
  if(!pa||!ref||state.reserveInit)return false;
  const hasNonAnnual=activeRules("reserved_budget").some(r=>r.accountId===pa.id&&r.frequency!=="annual");
  return hasNonAnnual&&ref>range.start&&ref<range.end
}

function visibleProjects(){return state.projects.filter(p=>!p.archived)}
function priorityRank(p){return p.priority==="high"?0:p.priority==="low"?2:1}
function projectStatusLabel(p){return p.status==="paused"?"En pause":p.status==="funded"?"Financé":"Actif"}
function projectCycleKey(){return isoLocal(activeCycleRange().start)}
function projectCycleReserved(p,key=projectCycleKey()){
  return Math.max(0,Number(p.cycleReservations?.[key])||0)
}
function projectRemainingBeforeCycle(p){
  const target=Math.max(0,Number(p.targetAmount)||0),funded=Math.max(0,Number(p.alreadyFunded)||0),carry=Math.max(0,Number(p.reservedCarry)||0);
  return Math.max(0,target-funded-carry)
}
function projectCycleSlots(p){
  const due=dateFromISO(p.targetDate);if(!due)return 1;
  return Math.max(1,cycleSlotsUntil(due,activeCycleRange()))
}
function projectRequiredContribution(p){
  const rem=projectRemainingBeforeCycle(p);if(rem<=0)return 0;
  return rem/projectCycleSlots(p)
}
function projectAllocationPlan(extraProject=null,options={}){
  const pa=primaryAccount();
  if(!pa)return {ready:false,currency:(state.settings||defaultSettings).mainCurrency||"CAD",capacity:0,carryTotal:0,totalContribution:0,allocations:{},projects:[]};
  const {respectFixed=true}=options;
  const currency=pa.currency,key=projectCycleKey();
  const baseSafe=calculateSafe(false),baseMargin=calculateCycleMargin(false);
  const existing=visibleProjects();
  const carryTotal=roundCurrency(existing.reduce((sum,p)=>sum+(Number(p.reservedCarry)||0),0),currency);
  const grossCapacity=(baseSafe.available&&baseMargin.available)?Math.max(0,Math.min(baseSafe.safe,baseMargin.margin)):0;
  let capacity=roundCurrency(Math.max(0,grossCapacity-carryTotal),currency);
  const allocations={},rows=[];

  // En usage quotidien, les contributions déjà décidées restent fixes pour éviter
  // qu'une dépense ordinaire ne redistribue silencieusement les projets.
  if(respectFixed){
    for(const p of existing){
      const hasFixed=Object.prototype.hasOwnProperty.call(p.cycleReservations||{},key);
      if(hasFixed){
        const fixed=roundCurrency(projectCycleReserved(p,key),currency);
        allocations[p.id]=fixed;
        capacity=roundCurrency(Math.max(0,capacity-fixed),currency)
      }
    }
  }

  // Lors d'un changement structurel (création, priorité, date, pause, annulation),
  // on peut ignorer les anciennes réservations du cycle et recalculer toute la file.
  const schedulable=[...existing.filter(p=>p.status!=="funded"&&(!respectFixed||!Object.prototype.hasOwnProperty.call(p.cycleReservations||{},key)))];
  if(extraProject)schedulable.push(extraProject);
  schedulable.sort((a,b)=>priorityRank(a)-priorityRank(b)||String(a.targetDate||"").localeCompare(String(b.targetDate||""))||String(a.createdAt||"").localeCompare(String(b.createdAt||"")));
  for(const p of schedulable){
    const remaining=projectRemainingBeforeCycle(p),slots=projectCycleSlots(p),required=roundCurrency(slots?remaining/slots:remaining,currency);
    let contribution=0;
    if(p.status!=="paused"&&remaining>0&&capacity>0){
      contribution=roundCurrency(Math.min(required,capacity,remaining),currency);
      capacity=roundCurrency(Math.max(0,capacity-contribution),currency)
    }
    allocations[p.id]=contribution
  }

  const allForRows=[...existing];if(extraProject)allForRows.push(extraProject);
  for(const p of allForRows){
    const remaining=projectRemainingBeforeCycle(p),slots=projectCycleSlots(p),required=roundCurrency(slots?remaining/slots:remaining,currency),contribution=roundCurrency(Number(allocations[p.id])||0,currency);
    rows.push({project:p,remaining,slots,required,contribution})
  }
  return {ready:baseSafe.available&&baseMargin.available,currency,grossCapacity,carryTotal,capacity,totalContribution:roundCurrency(rows.reduce((s,x)=>s+x.contribution,0),currency),allocations,projects:rows}
}
async function syncProjectCycleReservations(){
  const key=projectCycleKey(),plan=projectAllocationPlan();let changed=false;
  for(const p of visibleProjects()){
    if(p.status==="funded")continue;
    const map={...(p.cycleReservations||{})};
    if(!Object.prototype.hasOwnProperty.call(map,key)){
      map[key]=p.status==="paused"?0:roundCurrency(Number(plan.allocations[p.id])||0,plan.currency);
      p.cycleReservations=map;p.updatedAt=new Date().toISOString();await putOne(STORE_PROJECTS,p);changed=true
    }
  }
  if(changed)state.projects=await getAll(STORE_PROJECTS)
}
async function reallocateProjectCycleReservations(){
  const key=projectCycleKey(),plan=projectAllocationPlan(null,{respectFixed:false});let changed=false;
  for(const p of visibleProjects()){
    const map={...(p.cycleReservations||{})};
    const next=p.status==="funded"||p.status==="paused"?0:roundCurrency(Number(plan.allocations[p.id])||0,plan.currency);
    if(roundCurrency(Number(map[key])||0,plan.currency)!==next||!Object.prototype.hasOwnProperty.call(map,key)){
      map[key]=next;p.cycleReservations=map;p.updatedAt=new Date().toISOString();await putOne(STORE_PROJECTS,p);changed=true
    }
  }
  if(changed)state.projects=await getAll(STORE_PROJECTS);
  return plan
}
function addCyclesFromCurrent(count){
  const day=(state.settings||defaultSettings).cycleDay||2;let d=new Date(activeCycleRange().end);let n=Math.max(0,count-1);
  while(n-->0){let y=d.getFullYear(),m=d.getMonth()+1;if(m>11){m=0;y++}d=new Date(y,m,Math.min(day,maxDayInMonth(y,m)),12)}
  return d
}
function simulateProjectInput(input){
  const pa=primaryAccount(),currency=pa?.currency||(state.settings||defaultSettings).mainCurrency||"CAD";
  const tmp={id:"__simulation__",name:input.name||"Nouveau projet",targetAmount:Number(input.targetAmount)||0,targetDate:input.targetDate,alreadyFunded:Number(input.alreadyFunded)||0,reservedCarry:0,cycleReservations:{},priority:input.priority||"normal",status:"active",createdAt:new Date().toISOString()};
  const before=projectAllocationPlan(),after=projectAllocationPlan(tmp,{respectFixed:false}),row=after.projects.find(x=>x.project.id===tmp.id);
  const contribution=row?.contribution||0,required=row?.required||0,remaining=row?.remaining||0;
  const feasible=remaining<=0?"green":contribution+0.009>=required?"green":contribution>0?"orange":"red";
  let estimatedDate=null;
  if(remaining<=0)estimatedDate=localToday();
  else if(contribution>0)estimatedDate=addCyclesFromCurrent(Math.ceil(remaining/contribution));
  const beforeProtected=roundCurrency(before.carryTotal+before.totalContribution,currency),afterProtected=roundCurrency(after.carryTotal+after.totalContribution,currency);
  const netImpact=roundCurrency(Math.max(0,afterProtected-beforeProtected),currency);
  return {tmp,currency,remaining,required,contribution,feasible,estimatedDate,netImpact,before,after}
}
function projectReserveItems(){
  const pa=primaryAccount();if(!pa)return [];
  const plan=projectAllocationPlan(),currency=pa.currency,rows=[];
  for(const p of visibleProjects()){
    const carry=roundCurrency(Number(p.reservedCarry)||0,currency);
    const contribution=p.status==="funded"?0:roundCurrency(Number(plan.allocations[p.id])||0,currency);
    const amount=roundCurrency(carry+contribution,currency);
    if(amount<=0&&p.status==="funded")continue;
    const meta=p.status==="paused"
      ?`Projet en pause · ${money(carry,currency)} déjà réservé`
      :p.status==="funded"
        ?`Objectif entièrement couvert · ${money(carry,currency)} réservé`
        :`${money(carry,currency)} accumulé + ${money(contribution,currency)} ce cycle · cible ${p.targetDate?fmtDate(dateFromISO(p.targetDate)):"—"}`;
    rows.push({kind:"project",projectId:p.id,name:p.name||"Projet",amount,carry,contribution,meta})
  }
  return rows
}
function reserveBreakdown(includeProjects=true){
  const s=state.settings||defaultSettings,pa=primaryAccount(),range=activeCycleRange(),currency=pa?.currency||s.mainCurrency||"CAD";
  if(!pa)return {ready:false,currency,total:0,items:[],reason:"Compte principal requis"};
  const initRequired=reserveInitializationRequired();
  const initAmounts=state.reserveInit?.amounts||{};
  const items=[];
  const safety=roundCurrency(Number(s.safetyReserve)||0,currency);
  if(safety>0)items.push({kind:"safety",name:"Réserve de sécurité",amount:safety,meta:"Protection permanente"});
  for(const r of activeRules("reserved_budget").filter(r=>r.accountId===pa.id)){
    if(r.frequency==="annual"){
      const due=nextAnnualDue(r,range.start),slots=cycleSlotsUntil(due,range);
      const carry=roundCurrency(Number(state.reserveCarry?.annual?.[r.id])||0,currency);
      const target=roundCurrency(Number(r.amount)||0,currency);
      const remaining=roundCurrency(Math.max(0,target-carry),currency);
      const contribution=roundCurrency(remaining/slots,currency);
      const amount=roundCurrency(Math.min(target,carry+contribution),currency);
      const meta=carry>0
        ?`Provision cumulée · ${money(carry,currency)} reporté + ${money(contribution,currency)} ce cycle · échéance ${due?fmtDate(due):"—"}`
        :`Provision du cycle · échéance ${due?fmtDate(due):"—"} · ${slots} cycle(s) restant(s)`;
      items.push({kind:"annual",ruleId:r.id,name:r.name,amount,carry,contribution,dueISO:due?isoLocal(due):null,meta});
    }else{
      let amount;
      let baseAmount;
      const carry=(r.rollover?roundCurrency(Number(state.reserveCarry?.budgets?.[r.id])||0,currency):0);
      if(Object.prototype.hasOwnProperty.call(initAmounts,r.id))baseAmount=roundCurrency(initAmounts[r.id],currency);
      else if(initRequired)baseAmount=null;
      else baseAmount=roundCurrency((Number(r.amount)||0)+carry,currency);
      if(baseAmount===null)amount=null;
      else{
        const spent=roundCurrency(budgetSpentSinceReference(r.id),currency);
        amount=roundCurrency(Math.max(0,baseAmount-spent),currency);
      }
      const spent=roundCurrency(budgetSpentSinceReference(r.id),currency);
      const metaBase=r.frequency==="weekly"?"Budget hebdomadaire protégé":"Budget mensuel protégé";
      const carryText=carry>0?` · ${money(carry,currency)} reporté du cycle précédent`:"";
      items.push({kind:"budget",ruleId:r.id,name:r.name,amount,spent,baseAmount,carry,meta:(spent>0?`${metaBase} · ${money(spent,currency)} utilisé depuis la référence`:metaBase)+carryText});
    }
  }
  const ready=!items.some(x=>x.kind==="budget"&&x.amount===null);
  if(includeProjects&&ready)items.push(...projectReserveItems());
  const total=roundCurrency(items.reduce((a,x)=>a+(x.amount===null?0:Number(x.amount)||0),0),currency);
  return {ready,currency,total,items,initRequired,range}
}
function reserveBreakdownHTML(b){
  if(!b.items.length)return '<div class="empty">Aucune réserve configurée sur le compte principal.</div>';
  return `<div class="list">${b.items.map(x=>`<div class="item"><div class="row"><div><div class="name">${safeText(x.name)}</div><div class="meta">${safeText(x.meta)}</div></div><div class="amount">${x.amount===null?"À initialiser":money(x.amount,b.currency)}</div></div></div>`).join("")}</div>`

/* ===== Phase 3I : Clôture & Réconciliation ===== */
function generateRuleEventsRaw(start,end){
  const events=[];
  for(const r of activeRules()){
    if(!["fixed_income","debit","transfer"].includes(r.type))continue;
    for(const d of occurrenceDates(r,start,end))events.push(ruleToEvent(r,d))
  }
  events.sort((a,b)=>{const dd=a.date-b.date;if(dd!==0)return dd;if(a.direction!==b.direction)return a.direction==="out"?-1:1;return a.name.localeCompare(b.name,"fr")});
  return events
}
function closureBridgeEvents(preview=false){
  const range=activeCycleRange(),today=localToday();
  let end;
  if(preview&&today<range.end){end=new Date(range.end);end.setDate(end.getDate()+1)}
  else {end=new Date(today);end.setDate(end.getDate()+1)}
  return generateRuleEventsRaw(range.end,end)
}
function oldCyclePendingCount(){
  const range=activeCycleRange();
  return state.eventRecords.filter(r=>{
    const d=dateFromISO(r.dateISO);return d&&d>=range.start&&d<range.end&&r.status==="pending"
  }).length
}
function closureStatus(){
  const range=activeCycleRange(),today=localToday(),due=today>=range.end;
  const late=due?Math.max(0,Math.floor((today-range.end)/86400000)):0;
  return {range,today,due,late}
}

function buildNextReserveCarry(oldReserve,oldRange){
  const annual={},budgets={};
  for(const item of oldReserve.items){
    if(item.kind==="annual"){
      const due=item.dueISO?dateFromISO(item.dueISO):null;
      annual[item.ruleId]=(due&&due<oldRange.end)?0:Number(item.amount||0)
    }else if(item.kind==="budget"){
      const r=state.rules.find(x=>x.id===item.ruleId);
      if(r?.rollover)budgets[item.ruleId]=Number(item.amount||0)
    }
  }
  return {annual,budgets,createdAt:new Date().toISOString(),fromCycleStart:isoLocal(oldRange.start)}
}

async function rollProjectsAtClosure(){
  const pa=primaryAccount();if(!pa)return;
  const currency=pa.currency,key=projectCycleKey();
  for(const p of visibleProjects()){
    if(p.status==="funded")continue;
    const add=roundCurrency(projectCycleReserved(p,key),currency),remaining=Math.max(0,(Number(p.targetAmount)||0)-(Number(p.alreadyFunded)||0)-(Number(p.reservedCarry)||0));
    p.reservedCarry=roundCurrency((Number(p.reservedCarry)||0)+Math.min(add,remaining),currency);
    if((Number(p.alreadyFunded)||0)+(Number(p.reservedCarry)||0)+0.009>=(Number(p.targetAmount)||0))p.status="funded";
    p.lastClosedCycle=isoLocal(activeCycleRange().start);p.updatedAt=new Date().toISOString();await putOne(STORE_PROJECTS,p)
  }
}
async function performCycleClosure(bridgeEvents){
  const st=closureStatus();if(!st.due){alert("La clôture n’est pas encore disponible.");return}
  await syncDueEvents();await loadState();
  if(oldCyclePendingCount()>0){alert("Résolvez d’abord les confirmations en attente du cycle.");closeModal();render();return}
  const range=activeCycleRange(),pa=primaryAccount(),eop=calculateEOP(),reserved=reserveBreakdown(),safe=calculateSafe(),margin=calculateCycleMargin();
  if(!pa||!eop.available||!reserved.ready){alert("La clôture ne peut pas être calculée pour le moment.");return}
  const balances={};
  for(const el of document.querySelectorAll("[data-close-account]")){
    const a=accountById(el.dataset.closeAccount),v=Number(el.value);
    if(!a||!Number.isFinite(v)){alert("Vérifiez tous les soldes réels.");return}
    balances[a.id]=roundCurrency(v,a.currency)
  }
  const primaryReal=balances[pa.id];
  let includedPrimaryImpact=0;
  const bridgeSnapshots=[];
  for(let i=0;i<bridgeEvents.length;i++){
    const e=bridgeEvents[i],included=document.querySelector(`[data-bridge-included="${i}"]`)?.value==="yes";
    const actual=Number(document.querySelector(`[data-bridge-amount="${i}"]`)?.value);
    const amt=Number.isFinite(actual)?actual:Number(e.amount)||0;
    let primaryImpact=0;
    if(e.type==="fixed_income"&&e.accountId===pa.id)primaryImpact=amt;
    else if(e.type==="debit"&&e.accountId===pa.id)primaryImpact=-amt;
    else if(e.type==="transfer"&&e.accountId===pa.id)primaryImpact=-amt;
    if(included)includedPrimaryImpact=roundCurrency(includedPrimaryImpact+primaryImpact,pa.currency);
    const rec=eventSnapshot(e,included?"included_baseline":(e.executionMode==="confirm"?"pending":"calculated"));
    rec.actualAmount=amt;rec.afterReference=!included;rec.baselineIncluded=included;rec.closedBridge=true;rec.updatedAt=new Date().toISOString();
    bridgeSnapshots.push(rec)
  }
  const adjustedOldReal=roundCurrency(primaryReal-includedPrimaryImpact,pa.currency);
  const gap=roundCurrency(adjustedOldReal-eop.calculated,pa.currency);
  const closure={
    id:isoLocal(range.start),cycleStart:isoLocal(range.start),cycleEnd:isoLocal(range.end),closedAt:new Date().toISOString(),referenceDate:isoLocal(localToday()),
    currency:pa.currency,expectedEOP:eop.calculated,enteredPrimaryReal:primaryReal,includedNewCycleImpact:includedPrimaryImpact,adjustedOldCycleReal:adjustedOldReal,reconciliationGap:gap,
    reservedAtClose:reserved.total,safeAtClose:safe.available?safe.safe:null,marginProjectedAtClose:margin.available?margin.margin:null,
    accountBalances:balances,reserveItems:reserved.items.map(x=>({kind:x.kind,ruleId:x.ruleId||null,name:x.name,amount:x.amount})),bridgeEvents:bridgeSnapshots.map(x=>({id:x.id,name:x.name,dateISO:x.dateISO,status:x.status,afterReference:!!x.afterReference,actualAmount:x.actualAmount}))
  };
  const nextStart=range.end,carry=buildNextReserveCarry(reserved,range);
  await rollProjectsAtClosure();
  await putOne(STORE_CLOSURES,closure);
  await putOne(STORE_META,{key:`reserveCarry:${isoLocal(nextStart)}`,value:carry});
  for(const rec of bridgeSnapshots)await putOne(STORE_EVENTS,rec);
  for(const a of state.accounts){if(Object.prototype.hasOwnProperty.call(balances,a.id)){a.balance=balances[a.id];a.updatedAt=new Date().toISOString();await putOne(STORE_ACCOUNTS,a)}}
  const newSettings={...state.settings,activeCycleStart:isoLocal(nextStart),balanceReferenceDate:isoLocal(localToday()),dataVersion:5};
  await putOne(STORE_META,{key:"settings",value:newSettings});
  await loadState();closeModal();await syncDueEvents();await loadState();await syncProjectCycleReservations();await loadState();render()
}

/* ===== Phase 3I : Safe to Spend ===== */
function projectedImpactOnPrimary(e){
  const pa=primaryAccount();if(!pa)return {impact:0,uncertain:false};
  const rec=e.record||eventRecordById(e.id),st=effectiveEventState(e);
  if(st.status==="cancelled")return {impact:0,uncertain:false};
  const amount=(st.status==="confirmed"||st.status==="corrected")?Number(st.amount||0):Number(e.amount||0);
  if(e.type==="fixed_income"&&e.accountId===pa.id)return {impact:amount,uncertain:false};
  if(e.type==="debit"&&e.accountId===pa.id)return {impact:-amount,uncertain:false};
  if(e.type==="transfer"){
    let impact=0,uncertain=false;
    if(e.accountId===pa.id)impact-=amount;
    if(e.destinationId===pa.id){
      const actualDest=Number(rec?.actualDestinationAmount);
      if(Number.isFinite(actualDest))impact+=actualDest;
      else if(e.currency===pa.currency)impact+=amount;
      else uncertain=true; // entrée multidevise non connue : on ne la compte pas dans le Safe
    }
    return {impact,uncertain}
  }
  return {impact:0,uncertain:false}
}
function safeProjectionEvents(){
  const cal=generateCycleEvents(),today=localToday(),rows=[];
  for(const e of cal.events){
    const rec=e.record||eventRecordById(e.id),st=effectiveEventState(e);
    if(st.status==="cancelled")continue;
    let include=false;
    if(e.date>today)include=true;
    else if(!rec)include=true; // sécurité si la synchro d'une échéance n'a pas encore créé son snapshot
    else if(st.status==="pending")include=true; // dû mais pas encore appliqué à EOP
    if(!include)continue;
    const p=projectedImpactOnPrimary(e);
    if(p.impact===0&&!p.uncertain)continue;
    rows.push({...e,projectionImpact:p.impact,projectionUncertain:p.uncertain})
  }
  rows.sort((a,b)=>{
    const dd=a.date-b.date;if(dd!==0)return dd;
    if(a.projectionImpact!==b.projectionImpact)return a.projectionImpact-b.projectionImpact; // sorties avant entrées
    return a.name.localeCompare(b.name,"fr")
  });
  return rows
}
function calculateSafe(includeProjects=true){
  const eop=calculateEOP(),reserved=reserveBreakdown(includeProjects),pa=primaryAccount();
  if(!pa||!eop.available)return {available:false,reason:"EOP calculé indisponible"};
  if(!reserved.ready)return {available:false,reason:"Réserves du cycle à initialiser"};
  const currency=pa.currency,currentFree=roundCurrency(eop.calculated-reserved.total,currency);
  let running=currentFree,minFree=currentFree,limitingEvent=null,uncertain=false;
  const timeline=[];
  for(const e of safeProjectionEvents()){
    uncertain=uncertain||!!e.projectionUncertain;
    running=roundCurrency(running+Number(e.projectionImpact||0),currency);
    timeline.push({event:e,balance:running});
    if(running<minFree){minFree=running;limitingEvent=e}
  }
  const safe=roundCurrency(Math.max(0,minFree),currency);
  return {available:true,currency,eop:eop.calculated,reserved:reserved.total,currentFree,safe,minFree,limitingEvent,timeline,uncertain}
}

function calculateCycleMargin(includeProjects=true){
  const pa=primaryAccount(),eop=calculateEOP(),reserved=reserveBreakdown(includeProjects);
  if(!pa||!eop.available)return {available:false,reason:"EOP calculé indisponible"};
  if(!reserved.ready)return {available:false,reason:"Réserves du cycle à initialiser"};
  const currency=pa.currency;
  const future=safeProjectionEvents();
  let futureNet=0,uncertain=false;
  for(const e of future){
    futureNet=roundCurrency(futureNet+Number(e.projectionImpact||0),currency);
    uncertain=uncertain||!!e.projectionUncertain
  }
  const projectedEOP=roundCurrency(eop.calculated+futureNet,currency);
  const margin=roundCurrency(projectedEOP-reserved.total,currency);
  const range=activeCycleRange();
  return {
    available:true,currency,
    currentEOP:eop.calculated,
    futureNet,
    projectedEOP,
    reserved:reserved.total,
    margin,
    endDate:range.end,
    uncertain
  }
}

function projectPriorityLabel(p){return p.priority==="high"?"Haute":p.priority==="low"?"Basse":"Normale"}
function projectProgress(p,includeCurrent=true){
  const plan=projectAllocationPlan(),current=includeCurrent?(Number(plan.allocations[p.id])||0):0;
  const funded=Math.max(0,Number(p.alreadyFunded)||0),carry=Math.max(0,Number(p.reservedCarry)||0),target=Math.max(0,Number(p.targetAmount)||0);
  const covered=Math.min(target,funded+carry+current),pct=target>0?Math.min(100,(covered/target)*100):100;
  return {target,funded,carry,current,covered,pct,remaining:Math.max(0,target-covered)}
}

function simulateDistributionTest(inputs){
  const cap=distributionTestCapacity(),currency=cap.currency;
  if(!cap.ready)return {ready:false,currency,capacity:0,rows:[]};

  const projects=inputs.map((x,i)=>({
    id:`__test_${i}__`,
    name:x.name,
    targetAmount:Number(x.amount)||0,
    targetDate:x.targetDate,
    alreadyFunded:0,
    reservedCarry:0,
    cycleReservations:{},
    priority:x.priority,
    status:"active",
    createdAt:new Date(Date.now()+i).toISOString()
  }));

  projects.sort((a,b)=>
    priorityRank(a)-priorityRank(b) ||
    String(a.targetDate||"").localeCompare(String(b.targetDate||"")) ||
    String(a.createdAt||"").localeCompare(String(b.createdAt||""))
  );

  let remainingCapacity=cap.capacity;
  const rows=[];
  for(const p of projects){
    const remaining=Math.max(0,Number(p.targetAmount)||0);
    const slots=projectCycleSlots(p);
    const required=roundCurrency(slots?remaining/slots:remaining,currency);
    const allocated=roundCurrency(Math.min(required,remainingCapacity,remaining),currency);
    remainingCapacity=roundCurrency(Math.max(0,remainingCapacity-allocated),currency);
    rows.push({project:p,remaining,slots,required,allocated})
  }
  return {ready:true,currency,capacity:cap.capacity,remainingCapacity,rows}
}

function eventTypeLabel(e){return e.type==="fixed_income"?"Revenu fixe":e.type==="debit"?"Prélèvement":"Virement"}
function eventAccountLabel(e){
  const a=accountById(e.accountId);
  if(e.type!=="transfer")return a?.name||"?";
  const d=accountById(e.destinationId);return `${a?.name||"?"} → ${d?.name||"?"}`
}
function eventStatusBadge(e){
  const st=effectiveEventState(e).status;
  if(st==="pending")return '<span class="badge warn">À confirmer</span>';
  if(st==="confirmed")return '<span class="badge good">Confirmé</span>';
  if(st==="corrected")return '<span class="badge warn">Corrigé</span>';
  if(st==="cancelled")return '<span class="badge bad">Annulé</span>';
  if(st==="calculated")return '<span class="badge good">Calculé</span>';
  if(st==="included_baseline")return '<span class="badge good">Inclus dans le solde</span>';
  return '<span class="badge good">Prévu</span>'
}
function eventActionHTML(e){
  const st=effectiveEventState(e).status;
  if(st==="pending")return `<div class="event-actions"><button class="btn mini" data-event-confirm="${e.id}">Confirmer</button></div>`;
  if(["calculated","confirmed","corrected","cancelled"].includes(st))return `<div class="event-actions"><button class="btn mini alt" data-event-manage="${e.id}">Gérer</button></div>`;
  return ""
}
function displayEventAmount(e){
  const st=effectiveEventState(e),amount=(st.status==="confirmed"||st.status==="corrected")?st.amount:Number(e.amount);
  const sign=e.direction==="in"?"+":"−";
  return `${sign}${money(amount,e.currency)}`
}
function eventRows(events,limit=null){
  const rows=(limit?events.slice(0,limit):events);
  if(!rows.length)return '<div class="empty">Aucun événement prévu après le solde de référence dans ce cycle.</div>';
  let last="",html="";
  for(const e of rows){
    if(e.dateISO!==last){html+=`<div class="calendar-day">${safeText(fmtDay(e.date))}</div>`;last=e.dateISO}
    html+=`<div class="event"><div><div class="event-name">${safeText(e.name)}</div><div class="event-meta">${eventTypeLabel(e)} · ${safeText(eventAccountLabel(e))}</div><div class="status-line">${eventStatusBadge(e)}</div>${eventActionHTML(e)}</div><div class="event-amount ${e.direction==="in"?"in":"out"}">${displayEventAmount(e)}</div></div>`
  }
  return html
}

function crossCurrency(e){
  const src=accountById(e.accountId),dst=accountById(e.destinationId);
  return e.type==="transfer"&&src&&dst&&src.currency!==dst.currency
}
function openEventManager(e,mode="manage"){
  const rec=e.record||eventRecordById(e.id),st=effectiveEventState(e),isCross=crossCurrency(e),dst=accountById(e.destinationId);
  const actualDefault=(rec?.actualAmount??e.amount);
  const destDefault=rec?.actualDestinationAmount??"";
  const confirmMode=mode==="confirm"||st.status==="pending";
  openModal(confirmMode?"Confirmer l’opération":"Gérer l’événement",`<div class="note">${safeText(e.name)} · ${fmtDay(e.date)}<br>Montant prévu : ${money(e.amount,e.currency)}</div>
    <form id="eventForm">
      <label>${e.direction==="in"?"Montant réel reçu":"Débit réel"} (${e.currency})</label>
      <input id="eventActual" type="number" min="0" step="${e.currency==="TND"?"0.001":"0.01"}" required value="${actualDefault}">
      ${isCross?`<label>Crédit réel destination (${dst?.currency||e.destinationCurrency||""})</label><input id="eventDestinationActual" type="number" min="0" step="${(dst?.currency||e.destinationCurrency)==="TND"?"0.001":"0.01"}" required value="${destDefault}">`:""}
      <div class="form-actions"><button class="btn" type="submit">${confirmMode?"Confirmer":"Enregistrer la correction"}</button><button class="btn ghost" type="button" id="cancelEventForm">Fermer</button></div>
    </form>
    <div class="hr"></div><button class="btn bad" id="cancelOccurrence">Annuler cette occurrence</button>`);
  document.getElementById("cancelEventForm").onclick=closeModal;
  document.getElementById("eventForm").onsubmit=async ev=>{
    ev.preventDefault();
    const actual=Number(document.getElementById("eventActual").value);if(!Number.isFinite(actual)||actual<0)return alert("Montant réel invalide.");
    let dstActual=null;
    if(isCross){dstActual=Number(document.getElementById("eventDestinationActual").value);if(!Number.isFinite(dstActual)||dstActual<0)return alert("Crédit destination invalide.")}
    const base=rec?{...rec}:eventSnapshot(e,e.executionMode==="confirm"?"pending":"calculated");
    base.status=confirmMode?"confirmed":"corrected";base.actualAmount=actual;
    if(isCross)base.actualDestinationAmount=dstActual;
    base.updatedAt=new Date().toISOString();if(confirmMode)base.confirmedAt=new Date().toISOString();
    await putOne(STORE_EVENTS,base);await loadState();closeModal();render()
  };
  document.getElementById("cancelOccurrence").onclick=async()=>{
    if(!confirm("Annuler seulement cette occurrence ? La règle future reste active."))return;
    const base=rec?{...rec}:eventSnapshot(e,"cancelled");base.status="cancelled";base.updatedAt=new Date().toISOString();
    await putOne(STORE_EVENTS,base);await loadState();closeModal();render()
  }
}

  view.innerHTML=`<div class="card"><div class="title">Opérations réelles</div><div class="muted small" style="margin-bottom:12px">Revenus et dépenses saisis manuellement pendant le cycle.</div>${transactionRows()}</div>
  <div class="card"><div class="title">Événements du cycle</div><div class="note">Période : ${fmtDate(cal.range.start)} → ${fmtDate(cal.range.end)}. Les événements du jour de clôture appartiennent au cycle suivant. Les sorties sont affichées avant les entrées le même jour. « Calculé » signifie que l’événement automatique arrivé à échéance est déjà inclus dans EOP calculé; « À confirmer » ne l’est pas encore.</div><div style="margin-top:12px">${eventRows(cal.events)}</div></div>
  <div class="card"><div class="title">Contrôle EOP</div><div class="grid2"><div class="kpi"><div class="muted small">Réel de référence</div><div class="value">${money(eop.baseline,eop.currency)}</div></div><div class="kpi"><div class="muted small">Calculé aujourd’hui</div><div class="value">${money(eop.calculated,eop.currency)}</div></div></div></div>
  ${safeControlHTML(calculateSafe())}
  <div class="card"><div class="title">Réservé</div>${reserveBreakdownHTML(reserveBreakdown())}</div>
  <div class="card"><div class="title">Clôtures précédentes</div>${closuresHistoryHTML()}</div>`;
  bindEventActions();
  bindTransactionActions()
}

function renderRuleList(type){
  manageSection=type;headerSub.textContent=ruleLabels[type]+" · Phase 3I";
  const rules=visibleRules(type);
  view.innerHTML=`<div class="card"><div class="section-head"><div><button class="btn ghost" id="backManage">← Gérer</button></div><button class="btn" id="addRule">+ Ajouter</button></div><div class="title">${ruleLabels[type]}</div>
    <div class="list">${rules.length?rules.map(r=>`<button class="item" data-rule="${r.id}" style="width:100%;text-align:left;color:inherit"><div class="row"><div><div class="name">${safeText(r.name)}</div><div class="meta">${safeText(ruleMeta(r))}</div><div class="status-line">${statusBadge(r)}</div></div><div class="amount">${money(r.amount,ruleCurrency(r))}</div></div></button>`).join(""):'<div class="empty">Aucun élément. Utilisez « + Ajouter ».</div>'}</div>
  </div>`;
  document.getElementById("backManage").onclick=()=>{manageSection=null;renderManage()};
  document.getElementById("addRule").onclick=()=>{if(!activeAccounts().length){alert("Créez d'abord au moins un compte.");return}openModal("Ajouter · "+ruleLabels[type],ruleForm(type));bindRuleForm(type,null)};
  document.querySelectorAll("[data-rule]").forEach(b=>b.onclick=()=>{const r=state.rules.find(x=>x.id===b.dataset.rule);if(r)openRuleEditor(r)})
}

function renderManage(){
  if(manageSection){renderRuleList(manageSection);return}
  headerSub.textContent="Gérer mes finances · Phase 3I";
  const accounts=activeAccounts();
  const branch=(type)=>`<div class="tree-row"><div class="tree-main"><button class="tree-open" data-section="${type}"><strong>${ruleLabels[type]}</strong><div class="count">${ruleCount(type)} élément(s)</div></button></div><button class="btn alt" data-add="${type}">+ Ajouter</button></div>`;
  view.innerHTML=`<div class="card"><div class="title">Gérer mes finances</div><div class="tree">
    <div class="tree-row"><div class="tree-main"><strong>Comptes</strong><div class="count">${accounts.length} actif(s)</div></div><button class="btn alt" id="addAccountManage">+ Ajouter</button></div>
    ${branch("fixed_income")}${branch("debit")}${branch("reserved_budget")}${branch("transfer")}
    <div class="tree-row"><div class="tree-main"><button class="tree-open" id="openProjectsManage"><strong>Projets</strong><div class="count">${visibleProjects().length} projet(s)</div></button></div><span class="muted">›</span></div>
  </div></div>
  <div class="card"><div class="title">Mes comptes</div><div class="list">${accounts.length?accounts.map(a=>`<button class="item" data-account="${a.id}" style="width:100%;text-align:left;color:inherit"><div class="row"><div><div class="name">${safeText(a.name)}</div><div class="meta">${a.currency} · ${a.role==="primary_spending"?"Compte principal":a.role==="protected_savings"?"Épargne protégée":"Suivi seulement"}</div></div><div class="amount">${money(a.balance,a.currency)}</div></div></button>`).join(""):'<div class="empty">Aucun compte actif.</div>'}</div></div>`;
  document.getElementById("addAccountManage").onclick=()=>{openModal("Ajouter un compte",accountForm());bindAccountForm(null)};
  document.getElementById("openProjectsManage")?.addEventListener("click",()=>{page="projects";manageSection=null;render()});
  document.querySelectorAll("[data-section]").forEach(b=>b.onclick=()=>renderRuleList(b.dataset.section));
  document.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{const type=b.dataset.add;if(!activeAccounts().length){alert("Créez d'abord un compte.");return}openModal("Ajouter · "+ruleLabels[type],ruleForm(type));bindRuleForm(type,null)});
  document.querySelectorAll("[data-account]").forEach(btn=>btn.onclick=()=>{
    const acc=state.accounts.find(a=>a.id===btn.dataset.account);if(!acc)return;
    openModal("Modifier le compte",`${accountForm(acc)}<div class="hr"></div><button class="btn bad" id="archiveAccount">Archiver le compte</button>`);
    bindAccountForm(acc);
    document.getElementById("archiveAccount").onclick=async()=>{
      if(!confirm("Archiver ce compte ?"))return;
      acc.archived=true;await putOne(STORE_ACCOUNTS,acc);
      if(state.settings?.primaryAccountId===acc.id){state.settings.primaryAccountId=null;await putOne(STORE_META,{key:"settings",value:state.settings})}
      await loadState();closeModal();render()
    }
  })
}

function renderPlaceholder(title,text){headerSub.textContent=title+" · Phase 3I";view.innerHTML=`<div class="card"><div class="title">${title}</div><div class="empty">${text}</div></div>`}

function renderMore(){
  const s=state.settings||defaultSettings;headerSub.textContent="Plus · Phase 3I";
  view.innerHTML=`<div class="card"><div class="title">Paramètres de base</div><form id="editSettings">
    <label>Jour de clôture</label><input id="editCycleDay" type="number" min="1" max="28" value="${s.cycleDay}">
    <label>Devise principale</label><select id="editCurrency">${["CAD","TND","USD","EUR"].map(c=>`<option ${s.mainCurrency===c?"selected":""}>${c}</option>`).join("")}</select>
    <label>Réserve de sécurité</label><input id="editReserve" type="number" min="0" step="0.01" value="${s.safetyReserve}">
    <label>Cycle actif</label><input type="text" value="${fmtDate(activeCycleRange().start)} → ${fmtDate(activeCycleRange().end)}" disabled>
    <label>Date de référence du solde EOP</label><input id="editReferenceDate" type="date" value="${s.balanceReferenceDate||""}">
    <div class="muted small">À modifier seulement si vous confirmez un nouveau solde réel comme nouveau point de départ.</div>
    <div class="form-actions"><button class="btn" type="submit">Enregistrer</button></div>
  </form></div>
  <div class="card"><div class="title">Phase 3I</div><div class="note">EOP calculé, Réservé, Safe, Marge, opérations et clôture restent actifs. Phase 3I gère les projets avec réallocation réelle par priorité lors des changements structurels, sans redistribuer à chaque dépense quotidienne.</div></div>`;

  document.getElementById("editSettings").onsubmit=async e=>{
    e.preventDefault();
    s.cycleDay=Math.max(1,Math.min(28,Number(document.getElementById("editCycleDay").value)||2));
    s.mainCurrency=document.getElementById("editCurrency").value;
    s.safetyReserve=Math.max(0,Number(document.getElementById("editReserve").value)||0);
    s.balanceReferenceDate=document.getElementById("editReferenceDate").value||null;
    s.dataVersion=5;
    await putOne(STORE_META,{key:"settings",value:s});
    state.settings=s;await syncDueEvents();await loadState();render()
  }
}

function render(){
  if(!state.onboardingComplete){renderOnboarding();return}
  nav.hidden=false;
  nav.querySelectorAll("button").forEach(b=>b.classList.toggle("active",b.dataset.page===page));
  if(page==="home")renderHome();
  else if(page==="manage")renderManage();
  else if(page==="history")renderHistory();
  else if(page==="projects")renderProjects();
  else if(page==="more")renderMore()
}
nav.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{page=b.dataset.page;manageSection=null;render()}));

async function boot(){
  try{
    db=await openDB();
    await loadState();

    if(!state.settings){
      state.settings={...defaultSettings};
      state.settings.activeCycleStart=isoLocal(cycleRange(state.settings.cycleDay||2).start);
      await putOne(STORE_META,{key:"settings",value:state.settings})
    }else{
      const migrated={...defaultSettings,...state.settings,dataVersion:5};
      if(!migrated.activeCycleStart)migrated.activeCycleStart=isoLocal(cycleRange(migrated.cycleDay||2).start);
      const changed=JSON.stringify(migrated)!==JSON.stringify(state.settings);
      state.settings=migrated;
      if(changed)await putOne(STORE_META,{key:"settings",value:state.settings})
    }

    if(state.onboardingComplete&&state.settings?.balanceReferenceDate){await syncDueEvents();await loadState();await syncProjectCycleReservations();await loadState()}
    render()
  }catch(err){
    console.error(err);
    view.innerHTML='<div class="card"><div class="title">Erreur de stockage local</div><div class="note">IndexedDB n’a pas pu être ouvert sur ce navigateur.</div></div>'
  }
}
boot();
})();
</script>
</body>
</html>
